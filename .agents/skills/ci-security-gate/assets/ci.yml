# Referência de CI (GitHub Actions) para a skill ci-security-gate.
# Adapte os steps de "Lint", "Security scan" e "Test" ao seu gerenciador de pacotes/linguagem.
# Este template assume Node.js/TypeScript com Docker; comentários indicam onde trocar para outras stacks.
#
# Salvar em: .github/workflows/ci.yml

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Evita rodar duas vezes o mesmo commit em paralelo desnecessariamente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # Ruby: bundle exec rubocop
      # Python: ruff check .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
      # Ruby: bundle exec bundler-audit check --update
      # Python: pip-audit

  security-scan:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Semgrep cobre múltiplas linguagens; troque por Brakeman (Ruby) ou Bandit (Python) se preferir
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage
      # Ruby: bin/rails test
      # Python: pytest --cov

  docker-build:
    name: Build Docker image (validação, sem push)
    runs-on: ubuntu-latest
    needs: [lint, dependency-audit, security-scan, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (sem push, só valida que o Dockerfile builda)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Gate: todo o resto do pipeline (deploy) só roda se este workflow passar 100%.
# Ver cd.yml na skill deploy-pipeline-conductor para o que acontece depois deste ponto.
