services:
  orbit:
    # On the Raspberry Pi, pull the pre-built image from ghcr.io.
    # For local development you can override with: docker compose up --build
    image: ghcr.io/andrevictor20/orbit-dashboard:latest
    build:
      context: .
      # `build` is ignored when pulling the remote image; it's here so
      # local `docker compose up --build` still works for development.
    container_name: orbit-dashboard
    restart: unless-stopped
    network_mode: bridge
    privileged: true
    pid: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5172:5172"
      - "5173:5172"
    volumes:
      # Required to interact with the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Required for persistent Orbit data (SQLite DB, logs, store cache)
      - orbit_data:/app/data
      # Mount host root and drives with rslave propagation
      - /:/host:rslave
      - /mnt:/mnt:rslave
      - /media:/media:rslave
    environment:
      - RUST_LOG=info
      - SSH_HOST=host.docker.internal
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
  # ------------------------------------------------------------------
  # Watchtower: monitors ghcr.io for new :latest and auto-updates orbit
  # Checks every 5 minutes. Remove this service if you prefer manual updates.
  # ------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: orbit-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker config so Watchtower can pull from ghcr.io (authenticated)
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true          # Remove old images after update
      - WATCHTOWER_POLL_INTERVAL=300     # Check every 5 minutes
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_SCOPE=orbit           # Only watch containers with this label
    command: orbit-dashboard             # Only watch the orbit container

volumes:
  orbit_data:
