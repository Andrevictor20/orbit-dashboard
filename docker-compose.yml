services:
  orbit:
    # On the Raspberry Pi, pull the pre-built image from ghcr.io.
    # For local development you can override with: docker compose up --build
    image: ghcr.io/andrevictor20/orbit-dashboard:latest
    build:
      context: .
      # `build` is ignored when pulling the remote image; it's here so
      # local `docker compose up --build` still works for development.
    container_name: orbit-dashboard
    restart: unless-stopped
    network_mode: bridge
    # Security Architecture Note (SEC-007 Homelab Acceptance):
    # 'privileged: true' and 'pid: host' are required in local homelab dashboard context
    # to monitor host process tables, read system hardware metrics (temperature, fans),
    # interact with the host Docker socket and manage host storage mount propagation.
    privileged: true
    pid: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5172:5172"
      - "5173:5172"
    volumes:
      # Required to interact with the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Required for persistent Orbit data (SQLite DB, logs, store cache)
      - orbit_data:/app/data
      # Mount host root and drives with rslave propagation
      - /:/host:rslave
      - /mnt:/mnt:rslave
      - /media:/media:rslave
    environment:
      - RUST_LOG=info
      - SSH_HOST=host.docker.internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  orbit_data:

