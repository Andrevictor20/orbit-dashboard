services:
  orbit:
    build: .
    image: orbit-dashboard:latest
    container_name: orbit-dashboard
    restart: unless-stopped
    network_mode: bridge
    privileged: true
    pid: host
    ports:
      - "5172:5172"
      - "5173:5172"
    volumes:
      # Required to interact with the host's Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # Required for persistent Orbit data (SQLite DB, logs, store cache)
      - orbit_data:/app/data
    environment:
      - RUST_LOG=info

volumes:
  orbit_data:
