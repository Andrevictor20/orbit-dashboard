<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="0" fill="#000"/>
  <g transform="translate(256,256)">
    <!-- Orbit ring 1 - tilted ~30deg -->
    <ellipse cx="0" cy="0" rx="140" ry="80" 
      stroke="white" stroke-width="14" fill="none"
      transform="rotate(-30)"/>
    <!-- Orbit ring 2 - tilted ~90deg from ring 1 -->
    <ellipse cx="0" cy="0" rx="140" ry="80" 
      stroke="white" stroke-width="14" fill="none"
      transform="rotate(50)"/>
    <!-- Satellite node 1 -->
    <circle cx="-100" cy="-60" r="12" fill="white"/>
    <!-- Satellite node 2 -->
    <circle cx="80" cy="70" r="12" fill="white"/>
  </g>
</svg>