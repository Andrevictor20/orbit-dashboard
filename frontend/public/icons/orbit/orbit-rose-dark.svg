<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbit-core" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="orbit-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffe4e6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="orbit-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(244, 63, 94, 0.35)" flood-opacity="0.8" />
    </filter>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#4c0519" stroke="#fda4af" stroke-opacity="0.3" stroke-width="2"/>
