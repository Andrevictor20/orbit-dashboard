    <ellipse cx="50" cy="50" rx="26" ry="8.5" transform="rotate(-30 50 50)" stroke="#fff1f2" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="20" cy="33" r="3" fill="#fff1f2" stroke="#4c0519" stroke-width="1.5"/>
    <circle cx="78" cy="65" r="4" fill="#ffe4e6" stroke="#4c0519" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="19" fill="url(#orbit-core)"/>
    <path d="M37 40 C 42 34, 58 34, 63 40" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
    <path d="M 22 66 A 38 14 0 0 0 78 34" transform="rotate(-30 50 50)" stroke="url(#orbit-ring)" stroke-width="3.5" stroke-linecap="round"/>
