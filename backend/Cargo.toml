[package]
name = "backend"
version = "1.9.4"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bollard = "0.21.1"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
once_cell = "1.21.4"
portable-pty = "0.9.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sqlx = { version = "0.9.0", features = ["sqlite"] }
subtle = "2.6.1"
sysinfo = "0.39.6"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["set-header", "cors", "fs"] }
uuid = { version = "1.24.1", features = ["v4"] }
zip = "8.6.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"
regex = "1.13.1"
tokio-util = { version = "0.7", features = ["io"] }
libc = "0.2"

[dev-dependencies]
axum-test = "21.0.0"
http-body-util = "0.1.5"
tower = "0.5.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
