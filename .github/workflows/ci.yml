name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
    - name: Run SAST (Cargo Audit)
      run: cargo install cargo-audit && cd backend && cargo audit --ignore RUSTSEC-2023-0071
    - name: Run tests
      run: cd backend && cargo test
    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
    - name: Run Smoke Load Test
      run: |
        cd backend
        cargo run &
        sleep 10
        k6 run load-tests/smoke_test.js
  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: cd frontend && npm install
    - name: Run tests
      run: cd frontend && npm run test
    - name: Run SAST (npm audit)
      run: cd frontend && npm audit --audit-level=high
    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps
    - name: Run E2E tests
      run: cd frontend && npm run test:e2e

  test-security-dast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run OWASP ZAP API Scan
      uses: zaproxy/action-api-scan@v0.8.0
      with:
        target: 'http://localhost:5172'
        format: openapi
        docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
        issue_title: 'ZAP Security Report'
        fail_action: false

  test-mutation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: backend
    - name: Install cargo-mutants
      run: cargo install cargo-mutants
    - name: Run Mutation Testing
      run: cd backend && cargo mutants --no-shuffle || true # Prevent failing the whole build initially

  test-visual:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: cd frontend && npm install
    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps
    - name: Run Visual Regression Tests
      run: cd frontend && npm run test:visual:ci
