name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-backend:
    name: Backend Tests & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run SAST (Cargo Audit)
        uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          warn-on-unmaintained: false
          ignore: ["RUSTSEC-2023-0071"]

      - name: Run Backend Tests
        run: cd backend && cargo test

      - name: Setup Node (for wait-on)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Smoke Load Test
        run: |
          cd backend
          cargo run &
          npx --yes wait-on tcp:5172
          k6 run load-tests/smoke_test.js

  test-frontend:
    name: Frontend Tests, E2E & Visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: Run Unit Tests
        run: cd frontend && npm run test

      - name: Run SAST (npm audit)
        run: cd frontend && npm audit --audit-level=high

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & OS Deps
        run: cd frontend && npx playwright install --with-deps

      - name: Setup Rust for Backend API
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run E2E & Visual Tests
        run: |
          cd backend && cargo run &
          npx --yes wait-on tcp:5172
          cd frontend
          npm run test:e2e
          npm run test:visual:ci

  test-security-dast:
    name: Security DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node for wait-on
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Start Backend API
        run: |
          cd backend && cargo run &
          npx --yes wait-on tcp:5172

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:5172'
          format: openapi
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          issue_title: 'ZAP Security Report'
          artifact_name: 'zapresults'
          fail_action: false

