name: CD — Build & Publish Docker Image

on:
  workflow_run:
    workflows: [ "CI" ]   # Must match the `name:` field in ci.yml exactly
    types: [ completed ]
    branches: [ "main" ]

# Prevent concurrent deploys (e.g. two pushes in a row)
concurrency:
  group: cd-${{ github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # Build multi-arch image and push to ghcr.io
  # Watchtower on the Pi will detect the new :latest and auto-update
  # ------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    # workflow_run fires for ALL conclusions (success, failure, cancelled).
    # This guard ensures the image is ONLY published when CI is green.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that the CI tested and approved
          ref: ${{ github.event.workflow_run.head_sha }}

      # QEMU lets the x86 runner emulate ARM64 for the cross-build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate tags: latest + short SHA (e.g. sha-a1b2c3d)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in GitHub Actions Cache (fast on repeated builds)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`latest\`, \`sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Watchtower will auto-pull this image on the Raspberry Pi." >> $GITHUB_STEP_SUMMARY
