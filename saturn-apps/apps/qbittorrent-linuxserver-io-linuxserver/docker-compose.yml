name: linuxserver-qbittorrent
services:
  app:
    image: linuxserver/qbittorrent:5.2.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      WEBUI_PORT: ''
      TORRENTING_PORT: ''
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    - target: 6881
      published: 6881
      protocol: tcp
    - target: 6881
      published: 6881
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/qbittorrent/config
      target: /config
    - type: bind
      source: /DATA/AppData/qbittorrent/downloads
      target: /downloads
