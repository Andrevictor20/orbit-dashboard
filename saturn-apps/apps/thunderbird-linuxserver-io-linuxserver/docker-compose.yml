name: linuxserver-thunderbird
services:
  app:
    image: linuxserver/thunderbird:1140.15.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/thunderbird/config
      target: /config
