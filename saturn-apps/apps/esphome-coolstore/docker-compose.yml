name: esphome
services:
  app:
    image: esphome/esphome:2026.9
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      USERNAME: saturn
      PASSWORD: saturn
    volumes:
    - type: bind
      source: /DATA/AppData/esphome/config
      target: /config
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
      read_only: true
