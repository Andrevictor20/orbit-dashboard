id: lancache-play-860
name: LanCache
tagline: LAN Party game caching made easy
description: Make the most of your network. Get more play for your gamers. Download
  your games once and serve them out to many people at your LAN. The principle is
  to set up the NAS as a DNS server, hijack HTTP traffic to the NAS, cache the downloaded
  game files, and distribute them at high speed by the NAS when downloading again.
category: Network
version: 1.0.0
developer: LanCache.net
