name: mealie
services:
  app:
    image: hkotel/mealie:omni-nightly
    ports:
    - 3000:3000
    - 9000:9000
    volumes:
    - type: bind
      source: /DATA/AppData/mealie
      target: /app/data/
    environment:
      ALLOW_SIGNUP: true
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: https://0.0.0.0
    restart: unless-stopped
