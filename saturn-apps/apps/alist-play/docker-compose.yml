name: alist
services:
  alist:
    image: xhofe/alist:latest
    container_name: alist
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 5244
      published: '5244'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/alist/data
      target: /opt/alist/data
