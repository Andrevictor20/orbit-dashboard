name: flaresolverr
services:
  flaresolverr:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
      UMASK: '002'
      LOG_LEVEL: info
      LOG_HTML: 'false'
      CAPTCHA_SOLVER: none
    cpu_shares: 50
    command: []
    container_name: flaresolverr
    deploy:
      resources:
        reservations:
          memory: 64M
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/saturn-AppStore@main/Apps/FlareSolverr/icon.svg
    ports:
    - target: 8191
      published: '8191'
      protocol: tcp
    restart: unless-stopped
    network_mode: bridge
    privileged: false
