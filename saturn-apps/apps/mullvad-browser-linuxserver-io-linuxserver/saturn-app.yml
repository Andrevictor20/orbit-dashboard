id: mullvad-browser-linuxserver-io-linuxserver
name: Mullvad browser (LinuxServer.io)
tagline: The Mullvad Browser is a privacy-focused web browser developed in a collaboration
  between Mullvad VPN and the Tor Project. It’s designed to minimize tracking and
  fingerprinting. You could say it’s a Tor Browser to use without the Tor Network.
  Instead, you can use it with a trustworthy VPN.
