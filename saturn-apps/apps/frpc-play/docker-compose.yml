name: frpc
services:
  frpc:
    image: snowdreamtech/frpc:latest
    container_name: frpc
    deploy:
      resources:
        reservations:
          memory: 16M
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/frp/frpc.toml
      target: /etc/frp/frpc.toml
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
    - type: bind
      source: /etc/timezone
      target: /etc/timezone
