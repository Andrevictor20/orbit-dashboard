name: traefik-v2
services:
  traefik-v2:
    container_name: traefik-v2
    command: "sh -c '\n  if [ ! -f \"/etc/traefik/traefik.yml\" ]; then\n    echo\
      \ -n \"No config file found. Downloading config from GitHub... \"\n    wget\
      \ -O /etc/traefik/traefik.yml https://raw.githubusercontent.com/traefik/traefik/v2.10/traefik.sample.yml\n\
      \    if [ $? -eq 0 ]; then\n      echo \"done.\"\n    else\n      echo \"error.\"\
      \n      exit 1\n    fi\n    echo -n \"Enabeling API... \"\n    sed -i \"s/#api:/api:/\"\
      \ /etc/traefik/traefik.yml\n    sed -i \"s/#  insecure:/  insecure:/\" /etc/traefik/traefik.yml\n\
      \    echo \"done.\"\n    echo -n \"Enabeling Docker... \"\n    sed -i \"s/#providers:/providers:/g\"\
      \ /etc/traefik/traefik.yml\n    sed -i \"s/#  docker:/  docker:/g\" /etc/traefik/traefik.yml\n\
      \    sed -i \"s/^#    endpoint: tcp:\\/\\/.*/    endpoint: \\\"unix:\\/\\/\\\
      /var\\/run\\/docker.sock\\\"/g\" /etc/traefik/traefik.yml\n    echo \"done.\"\
      \n  fi\n  traefik'\n"
    image: traefik:v2.11
    labels:
      icon: https://raw.githubusercontent.com/mr-manuel/saturn-HomeAutomation-AppStore/latest/Apps/Traefik-v2/icon.png
    network_mode: bridge
    ports:
    - target: 80
      published: '81'
      protocol: tcp
    - target: 443
      published: '443'
      protocol: tcp
    - target: 8080
      published: '8080'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /etc/traefik
