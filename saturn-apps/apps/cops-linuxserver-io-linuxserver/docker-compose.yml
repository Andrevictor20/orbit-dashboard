name: linuxserver-cops
services:
  app:
    image: linuxserver/cops:4.5.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    - target: 443
      published: 443
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/cops/config
      target: /config
    - type: bind
      source: /DATA/AppData/cops/books
      target: /books
