name: linuxserver-snapdrop
services:
  app:
    image: linuxserver/snapdrop:version-f88d46ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    - target: 443
      published: 443
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/snapdrop/config
      target: /config
