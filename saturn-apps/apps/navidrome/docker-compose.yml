name: navidrome
services:
  navidrome:
    container_name: navidrome
    deploy:
      resources:
        reservations:
          memory: 1024M
    image: deluan/navidrome:0.61.2
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/saturn-AppStore@main/Apps/Navidrome/icon.svg
    restart: unless-stopped
    ports:
    - target: 4533
      published: '4533'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /data
    - type: bind
      source: /DATA/Media/Music
      target: /music
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ''
      TZ: $TZ
    network_mode: bridge
    privileged: false
