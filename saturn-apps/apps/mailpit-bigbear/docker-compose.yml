name: big-bear-mailpit
services:
  app:
    image: axllent/mailpit:v1.30@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    container_name: mailpit
    restart: unless-stopped
    volumes:
    - /DATA/AppData/$AppID/data:/data
    environment:
    - TZ=UTC
    ports:
    - 8025:8025
    - 1025:1025
