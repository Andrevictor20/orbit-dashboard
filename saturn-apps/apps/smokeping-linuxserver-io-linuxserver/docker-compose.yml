name: linuxserver-smokeping
services:
  app:
    image: linuxserver/smokeping:2.9.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/smokeping/config
      target: /config
    - type: bind
      source: /DATA/AppData/smokeping/data
      target: /data
