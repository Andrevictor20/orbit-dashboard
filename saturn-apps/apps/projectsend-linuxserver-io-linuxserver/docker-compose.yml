name: linuxserver-projectsend
services:
  app:
    image: linuxserver/projectsend:version-r2098
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/projectsend/config
      target: /config
    - type: bind
      source: /DATA/AppData/projectsend/data
      target: /data
