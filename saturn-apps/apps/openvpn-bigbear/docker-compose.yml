name: big-bear-openvpn-as
services:
  big-bear-openvpn-as:
    container_name: big-bear-openvpn-as
    image: openvpn/openvpn-as:2.13.1-d8cdeb9c-Ubuntu22@sha256:609aa2238acef1cb3b277c1e7f293e21da1033fb2eb1b52f51e8b22d6ee7227c
    restart: unless-stopped
    privileged: true
    cap_add:
    - NET_ADMIN
    environment:
    - PGID=1000
    - PUID=1000
    - TZ=Europe/Rome
    hostname: OpenVPN
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/openvpn.png
    ports:
    - 943:943/tcp
    - 443:443/tcp
    - 1194:1194/udp
    volumes:
    - /DATA/AppData/$AppID/data:/openvpn
    network_mode: bridge
