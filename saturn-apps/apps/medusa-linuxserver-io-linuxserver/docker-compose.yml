name: linuxserver-medusa
services:
  app:
    image: linuxserver/medusa:1.0.26
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 8081
      published: 8081
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/medusa/config
      target: /config
    - type: bind
      source: /DATA/AppData/medusa/downloads
      target: /downloads
    - type: bind
      source: /DATA/AppData/medusa/tv
      target: /tv
