name: uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
    - 3001:3001
    volumes:
    - /DATA/AppData/uptime-kuma/data:/app/data
    deploy:
      resources:
        reservations:
          memory: 256M
