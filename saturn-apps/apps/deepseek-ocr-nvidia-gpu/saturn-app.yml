id: deepseek-ocr-nvidia-gpu
name: DeepSeek OCR(Nvidia GPU)
tagline: Powerful OCR powered by DeepSeek AI
description: 'DeepSeek OCR is a powerful open-source OCR (Optical Character Recognition)
  tool based on the advanced DeepSeek-AI model. It enables accurate text extraction
  from images and document scans via a user-friendly web interface and API. Supports
  various image formats and offers configurations for image size, cropping, and upload
  limits. Additionally, DeepSeek OCR features four core recognition modes: Plain OCR
  for raw text extraction, Describe for intelligent image content descriptions, Find
  for keyword localization with visual bounding box returns, and Freeform for flexible
  image understanding tasks based on custom prompts.


  **Key Features:**

  - High-accuracy text recognition with DeepSeek-OCR, supporting images and multi-page
  PDF documents

  - Preserves document layout including tables, formulas, and structural formatting

  - Web frontend (React) and REST API (FastAPI) for easy usage and system integration

  - Export results to Markdown, HTML, DOCX, or JSON formats

  - Automatic extraction and embedding of images from PDF files

  - GPU acceleration and Docker deployment for fast and scalable processing


  **Prerequisites:**

  - ZimaOS version 1.5.2 or higher, or NVIDIA Open Driver version 580 or higher

  - NVIDIA GPU with >= 8 GB VRAM for optimal performance


  **Learn More:**

  - [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)'
