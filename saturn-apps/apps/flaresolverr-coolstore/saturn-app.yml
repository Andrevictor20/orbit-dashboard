name: FlareSolverr
tagline: FlareSolverr is a proxy server to bypass Cloudflare protection.
description: FlareSolverr is a proxy server to bypass Cloudflare protection. FlareSolverr
  starts a proxy server, and it waits for user requests in an idle state using few
  resources. When some request arrives, it uses Selenium with the undetected-chromedriver
  to create a web browser (Chrome). It opens the URL with user parameters and waits
  until the Cloudflare challenge is solved (or timeout). The HTML code and the cookies
  are sent back to the user, and those cookies can be used to bypass Cloudflare using
  other HTTP clients.
