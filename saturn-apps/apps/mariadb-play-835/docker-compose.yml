name: mariadb-arm
services:
  mariadb-arm:
    image: linuxserver/mariadb:arm32v7-10.6.13
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_ROOT_PASSWORD: saturn
      MYSQL_DATABASE: saturn
      MYSQL_USER: saturn
      MYSQL_PASSWORD: saturn
      REMOTE_SQL: ''
    ports:
    - target: 3306
      published: '3306'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/mariadb/config
      target: /config
    container_name: mariadb-arm
    network_mode: bridge
