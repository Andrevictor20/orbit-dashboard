name: linuxserver-quassel-web
services:
  app:
    image: linuxserver/quassel-web:version-019bfdc1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      QUASSEL_CORE: ''
      QUASSEL_PORT: ''
      QUASSEL_HTTPS: ''
      URL_BASE: ''
    ports:
    - target: 64080
      published: 64080
      protocol: tcp
    - target: 64443
      published: 64443
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/quassel-web/config
      target: /config
