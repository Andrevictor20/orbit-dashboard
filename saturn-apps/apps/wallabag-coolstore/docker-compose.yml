name: wallabag
services:
  app:
    image: wallabag/wallabag:2.6.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: saturn
      POSTGRES_PASSWORD: saturn
      SYMFONY__ENV__DATABASE_DRIVER: pdo_pgsql
      SYMFONY__ENV__DATABASE_HOST: db
      SYMFONY__ENV__DATABASE_USER: saturn
      SYMFONY__ENV__DATABASE_PASSWORD: saturn
      SYMFONY__ENV__DATABASE_NAME: saturn
      SYMFONY__ENV__DATABASE_PORT: 5432
      SYMFONY__ENV__SECRET: ''
      SYMFONY__ENV__DOMAIN_NAME: ''
      SYMFONY__ENV__MAILER_HOST: ''
      SYMFONY__ENV__MAILER_USER: ''
      SYMFONY__ENV__MAILER_PASSWORD: ''
      SYMFONY__ENV__FROM_EMAIL: ''
      SYMFONY__ENV__FOSUSER_REGISTRATION: ''
      SYMFONY__ENV__FOSUSER_CONFIRMATION: ''
    depends_on:
    - db
    ports:
    - target: 80
      published: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/Wallabag/data
      target: /var/www/wallabag/data
    - type: bind
      source: /DATA/AppData/Wallabag/images
      target: /var/www/wallabag/web/assets/images
  db:
    image: postgres:15.19
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: saturn
      POSTGRES_PASSWORD: saturn
      POSTGRES_DB: saturn
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/postgres/data
      target: /var/lib/postgresql/data
