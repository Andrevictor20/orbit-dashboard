name: linuxserver-openvscode-server
services:
  app:
    image: linuxserver/openvscode-server:1.109.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_SECRET: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/openvscode-server/config
      target: /config
    - type: bind
      source: /
      target: /saturn
