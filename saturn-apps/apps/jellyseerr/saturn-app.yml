id: jellyseerr
name: Jellyseerr
tagline: Jellyseerr is a free and open source software application for managing requests
  for your media library.
description: 'Jellyseerr is a self-hosted media request and management tool designed
  to streamline media library request and discovery processes, offering an intuitive
  Web interface, ideal for home media server users and small teams. It seamlessly
  integrates with existing media services, enabling efficient management of movies,
  shows, and mixed content libraries.


  The tool''s core features include a customizable request system and broad media
  server integration. It allows users to request movies or individual show seasons
  through a user-friendly interface, with administrators able to approve requests
  via a simple management UI. It integrates with Jellyfin, Emby, and Plex, supporting
  user import and authentication with existing accounts. Diverse notification channels
  (e.g., Discord, Telegram, Email) provide real-time request status updates, and library
  scanning tracks available media to prevent duplicate requests.


  It offers a granular permission system, enabling precise control over user access
  and actions. The mobile-friendly design facilitates on-the-go request approvals,
  while watchlist and blacklist support help users filter content. Support for PostgreSQL
  and SQLite databases ensures flexible deployment options. Community support via
  GitHub and Discord provides documentation and assistance, delivering a modern media
  management solution with intuitive operation and high flexibility.


  **Key Features:**

  - Full Jellyfin/Emby/Plex integration including authentication with user import
  & management.

  - Support for PostgreSQL and SQLite databases.

  - Supports Movies, Shows and Mixed Libraries.

  - Ability to change email addresses for SMTP purposes.

  - Easy integration with your existing services. Currently, Jellyseerr supports Sonarr
  and Radarr.

  - Jellyfin/Emby/Plex library scan, to keep track of the titles which are already
  available.

  - Customizable request system, which allows users to request individual seasons
  or movies in a friendly, easy-to-use interface.

  - Incredibly simple request management UI. Don''t dig through the app to simply
  approve recent requests!

  - Granular permission system.

  - Support for various notification agents.

  - Mobile-friendly design, for when you need to approve requests on the go!

  - Support for watchlisting & blacklisting media.


  **Learn More:**

  - [Jellyseerr Documentation](https://docs.jellyseerr.dev/)

  - [Jellyseerr GitHub Repository](https://github.com/Fallenbagel/jellyseerr)'
