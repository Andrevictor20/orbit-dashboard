name: linuxserver-unrar
services:
  app:
    image: linuxserver/unrar:7.0.9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/unrar/config
      target: /config
