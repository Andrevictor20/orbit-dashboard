name: moviepilot-v2
services:
  moviepilot-v2:
    stdin_open: true
    tty: true
    container_name: moviepilot-v2
    hostname: moviepilot-v2
    ports:
    - target: 3000
      published: '3000'
      protocol: tcp
    volumes:
    - /DATA/Media:/media
    - /DATA/AppData/moviepilot-v2/config:/config
    - /DATA/AppData/moviepilot-v2/core:/moviepilot/.cache/ms-playwright
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - NGINX_PORT=3000
    - PORT=3001
    - PUID=0
    - PGID=0
    - UMASK=000
    - TZ=Asia/Shanghai
    - AUTH_SITE=iyuu
    - IYUU_SIGN=xxxx
    - SUPERUSER=admin
    restart: unless-stopped
    image: jxxghp/moviepilot-v2:latest
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
