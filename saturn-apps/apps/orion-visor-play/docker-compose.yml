name: orion-visor
services:
  orion-visor:
    image: registry.cn-hangzhou.aliyuncs.com/orionsec/orion-visor-service:2.2.2
    privileged: true
    ports:
    - 1081:80
    environment:
      MYSQL_HOST: orion-visor-mysql
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: orion_visor
      MYSQL_USER: root
      MYSQL_PASSWORD: Data@123456
      REDIS_HOST: orion-visor-redis
      REDIS_PASSWORD: Data@123456
      SECRET_KEY: uQeacXV8b3isvKLK
      DEMO_MODE: 'false'
    volumes:
    - /DATA/AppData/orion-visor/service/root-orion:/root/orion
    healthcheck:
      test:
      - CMD
      - curl
      - http://127.0.0.1:9200/orion-visor/api/server/bootstrap/health
      interval: 15s
      timeout: 300s
      retries: 15
      start_period: 3s
    depends_on:
      orion-visor-mysql:
        condition: service_healthy
      orion-visor-redis:
        condition: service_healthy
    links:
    - orion-visor-mysql
    - orion-visor-redis
    restart: unless-stopped
    container_name: orion-visor
    deploy:
      resources:
        reservations:
          memory: 512M
    networks:
    - orion-visor
  orion-visor-mysql:
    image: registry.cn-hangzhou.aliyuncs.com/orionsec/orion-visor-mysql:2.2.2
    privileged: true
    environment:
      MYSQL_DATABASE: orion_visor
      MYSQL_USER: orion
      MYSQL_PASSWORD: Data@123456
      MYSQL_ROOT_PASSWORD: Data@123456
    volumes:
    - /DATA/AppData/orion-visor/mysql/var-lib-mysql:/var/lib/mysql
    - /DATA/AppData/orion-visor/mysql/var-lib-mysql-files:/var/lib/mysql-files
    - /DATA/AppData/orion-visor/mysql/etc-mysql:/etc/mysql
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - cat < /dev/null > /dev/tcp/127.0.0.1/3306
      interval: 15s
      timeout: 60s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    container_name: orion-visor-mysql
    networks:
    - orion-visor
  orion-visor-redis:
    image: registry.cn-hangzhou.aliyuncs.com/orionsec/orion-visor-redis:2.2.2
    privileged: true
    environment:
      REDIS_PASSWORD: Data@123456
    volumes:
    - /DATA/AppData/orion-visor/redis/data:/data
    command: sh -c "redis-server /usr/local/redis.conf --requirepass Data@123456"
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --raw
      - incr
      - ping
      interval: 15s
      timeout: 60s
      retries: 15
      start_period: 3s
    restart: unless-stopped
    container_name: orion-visor-redis
    networks:
    - orion-visor
networks:
  orion-visor:
    name: orion-visor
