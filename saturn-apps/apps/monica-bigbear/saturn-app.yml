name: Monica
tagline: A Personal Relationship Management tool to help you document your social
  life.
description: Monica is an open-source web application to organize and record your
  interactions with your loved ones. We call it a PRM, or Personal Relationship Management.
  Think of it as a CRM (a popular tool used by sales teams in the corporate world)
  for your friends or family.
