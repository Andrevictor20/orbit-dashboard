id: pelorus-linuxserver-io-linuxserver
name: Pelorus (LinuxServer.io)
tagline: An AI navigator for Selkies-powered Linux desktops. Pelorus runs a FastAPI
  server that gives an LLM agent (Ollama, OpenAI-compatible, or Gemini) control over
  mouse, keyboard, screenshot, and window management via the Pixelflux computer-use
  backend, a Linux accessibility tree (AT-SPI), and optional KWin D-Bus integration.
