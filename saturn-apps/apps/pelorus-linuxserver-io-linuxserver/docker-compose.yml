name: linuxserver-pelorus
services:
  app:
    image: linuxserver/pelorus:0.2.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/pelorus/config
      target: /config
