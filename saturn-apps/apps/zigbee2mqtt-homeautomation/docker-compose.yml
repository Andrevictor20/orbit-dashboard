name: zigbee2mqtt
services:
  zigbee2mqtt:
    container_name: zigbee2mqtt
    command: "sh -c '\n  CONFIG_FILE=\"/app/data/configuration.yaml\"\n  if [ ! -f\
      \ \"$CONFIG_FILE\" ]; then\n    echo \"No config file found. Creating one...\"\
      \n    if [ ! -d \"/app/data\" ]; then\n      echo \"Creating directory /app/data...\"\
      \n      mkdir -p /app/data\n    fi\n    wget -O /app/data/configuration.yaml\
      \ https://raw.githubusercontent.com/Koenkk/zigbee2mqtt/master/data/configuration.yaml\n\
      \    echo \"Config file downloaded successfully.\"\n  fi'\n"
    image: koenkk/zigbee2mqtt:latest
    labels:
      icon: https://raw.githubusercontent.com/mr-manuel/saturn-HomeAutomation-AppStore/latest/Apps/Zigbee2MQTT/icon.png
      traefik.enable: false
    network_mode: bridge
    ports:
    - target: 8080
      published: '8080'
      protocol: tcp
    restart: unless-stopped
    devices:
    - /dev/bus/usb:/dev/bus/usb
    volumes:
    - type: bind
      source: /DATA/AppData/zigbee2mqtt/data
      target: /app/data
    - type: bind
      source: /run/udev
      target: /run/udev:ro
