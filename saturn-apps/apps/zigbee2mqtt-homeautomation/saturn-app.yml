id: zigbee2mqtt-homeautomation
name: Zigbee2MQTT
tagline: Zigbee2MQTT allows you to use your Zigbee devices without the vendor's bridge
  or gateway. It bridges events and allows you to control your Zigbee devices via
  MQTT. In this way you can integrate your Zigbee devices with whatever smart home
  infrastructure you are using.
description: Visit [Zigbee2MQTT](https://www.zigbee2mqtt.io) for more details. Check
  the [documentation](https://www.zigbee2mqtt.io/guide/getting-started/) for further
  settings.
category: Home Automation
version: 1.0.0
