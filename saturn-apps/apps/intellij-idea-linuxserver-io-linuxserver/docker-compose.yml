name: linuxserver-intellij-idea
services:
  app:
    image: linuxserver/intellij-idea:42026.2.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/intellij-idea/config
      target: /config
