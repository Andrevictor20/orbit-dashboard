name: dsm
services:
  dsm:
    cap_add:
    - NET_ADMIN
    container_name: dsm
    deploy:
      resources:
        reservations:
          memory: 2048M
    devices:
    - /dev/kvm:/dev/kvm
    environment:
    - DISK_SIZE=16G
    image: vdsm/virtual-dsm:latest
    ports:
    - target: 5000
      published: '5000'
      protocol: tcp
    restart: unless-stopped
    stop_grace_period: 2m0s
    volumes:
    - type: bind
      source: /DATA/AppData/dsm
      target: /storage
    network_mode: bridge
    privileged: false
