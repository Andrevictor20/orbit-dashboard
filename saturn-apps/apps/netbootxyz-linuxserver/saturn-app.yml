id: netbootxyz-linuxserver
name: Netbootxyz
tagline: A way to PXE boot various operating system installers or utilities from one
  place within the BIOS without the need of having to go retrieve the media to run
  the tool. IPXE is used to provide a user friendly menu from within the BIOS that
  lets you easily choose the operating system you want along with any specific types
  of versions or bootable flags.
description: 'Visit homepage: https://hub.docker.com/r/linuxserver/netbootxyz/'
