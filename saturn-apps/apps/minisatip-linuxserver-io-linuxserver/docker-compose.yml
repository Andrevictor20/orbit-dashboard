name: linuxserver-minisatip
services:
  app:
    image: linuxserver/minisatip:2.0.103
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      RUN_OPTS: ''
    ports:
    - target: 8875
      published: 8875
      protocol: tcp
    - target: 554
      published: 554
      protocol: tcp
    - target: 1900
      published: 1900
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/minisatip/config
      target: /config
