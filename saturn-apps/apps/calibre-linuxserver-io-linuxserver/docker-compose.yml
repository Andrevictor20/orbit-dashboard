name: linuxserver-calibre
services:
  app:
    image: linuxserver/calibre:9.14.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CLI_ARGS: ''
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    - target: 8181
      published: 8181
      protocol: tcp
    - target: 8081
      published: 8081
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/calibre/config
      target: /config
