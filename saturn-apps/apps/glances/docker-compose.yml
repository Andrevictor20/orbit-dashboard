name: glances
services:
  glances:
    container_name: glances
    image: nicolargo/glances:4.5.4
    pid: host
    deploy:
      resources:
        reservations:
          memory: 256M
    environment:
      GLANCES_OPT: -w
    restart: unless-stopped
    network_mode: bridge
    privileged: false
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - type: bind
      source: /mnt
      target: /mnt
    ports:
    - target: 61208
      published: '61208'
      protocol: tcp
    - target: 61209
      published: '61209'
      protocol: tcp
