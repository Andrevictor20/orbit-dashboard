name: linuxserver-qemu-static
services:
  app:
    image: linuxserver/qemu-static:10.0.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/qemu-static/config
      target: /config
