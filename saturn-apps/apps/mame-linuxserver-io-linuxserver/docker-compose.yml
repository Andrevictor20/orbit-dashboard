name: linuxserver-mame
services:
  app:
    image: linuxserver/mame:version-0.289dfsg1-0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/mame/config
      target: /config
    - type: bind
      source: /DATA/AppData/mame/mame:ro
      target: /mame:ro
