name: autobrr
services:
  autobrr:
    container_name: autobrr
    image: ghcr.io/autobrr/autobrr:v1.79.0
    network_mode: bridge
    restart: unless-stopped
    environment:
      TZ: $TZ
    ports:
    - target: 7474
      published: '7474'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
