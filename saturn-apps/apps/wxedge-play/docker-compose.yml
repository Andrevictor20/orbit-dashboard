name: wxedge
services:
  wxedge:
    container_name: wxedge
    deploy:
      resources:
        reservations:
          memory: 512M
    hostname: wxedge
    image: onething1/wxedge
    privileged: true
    restart: unless-stopped
    tmpfs:
    - /tmp
    - /run
    volumes:
    - type: bind
      source: /DATA/AppData/wxedge
      target: /storage
    network_mode: host
