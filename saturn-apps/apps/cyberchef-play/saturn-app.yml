id: cyberchef-play
name: CyberChef
tagline: The Cyber Swiss Army Knife
description: CyberChef is a simple, intuitive web app for carrying out all manner
  of "cyber" operations within a web browser. These operations include simple encoding
  like XOR and Base64, more complex encryption like AES, DES and Blowfish, creating
  binary and hexdumps, compression and decompression of data, calculating hashes and
  checksums, IPv6 and X.509 parsing, changing character encodings, and much more.
category: Productivity
