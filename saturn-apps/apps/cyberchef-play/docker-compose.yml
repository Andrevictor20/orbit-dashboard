name: cyberchef
services:
  cyberchef:
    image: ghcr.io/gchq/cyberchef:latest
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
    ports:
    - target: 80
      published: '8088'
      protocol: tcp
    restart: unless-stopped
    container_name: cyberchef
