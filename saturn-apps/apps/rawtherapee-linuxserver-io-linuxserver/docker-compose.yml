name: linuxserver-rawtherapee
services:
  app:
    image: linuxserver/rawtherapee:5.13.20260913
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/rawtherapee/config
      target: /config
