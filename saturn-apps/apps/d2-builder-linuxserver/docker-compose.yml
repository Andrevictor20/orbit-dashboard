name: linuxserver-d2-builder
services:
  app:
    image: linuxserver/d2-builder:0.6.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/d2-builder/config
      target: /config
