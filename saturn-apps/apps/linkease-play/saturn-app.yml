id: linkease-play
name: LinkEase
tagline: Private cloud drive that everyone can use
description: LinkEase is a cross-platform family photo album, audio and video media,
  file transfer, and remote control solution. It provides seamless data exchange across
  all platforms and allows you to enjoy P2P high-speed file transfer. You can also
  back up your photos and files anytime, anywhere, easily creating your own private
  cloud service.  LinkEase also supports adding various applications such as web pages,
  SSH, remote routing, remote downloading, and remote viewing. It supports multiple
  network protocols such as WebDAV, SFTP, SAMBA, and S3, enabling easy remote application
  management through the mobile app.
