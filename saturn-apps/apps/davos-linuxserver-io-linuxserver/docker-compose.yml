name: linuxserver-davos
services:
  app:
    image: linuxserver/davos:2.2.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/davos/config
      target: /config
    - type: bind
      source: /DATA/AppData/davos/download
      target: /download
