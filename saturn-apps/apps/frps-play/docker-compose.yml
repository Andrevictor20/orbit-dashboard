name: frps
services:
  frps:
    image: snowdreamtech/frps:latest
    container_name: frps
    deploy:
      resources:
        reservations:
          memory: 16M
    network_mode: host
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/frp/frps.toml
      target: /etc/frp/frps.toml
    - type: bind
      source: /etc/localtime
      target: /etc/localtime
    - type: bind
      source: /etc/timezone
      target: /etc/timezone
