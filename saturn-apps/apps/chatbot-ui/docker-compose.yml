name: chatbot-ui
services:
  chatbot-ui:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: ghcr.io/mckaywrigley/chatbot-ui:main
    network_mode: bridge
    ports:
    - target: 3000
      published: '3080'
      protocol: tcp
    restart: unless-stopped
    container_name: chatbot-ui
