name: syncthing-arm
services:
  syncthing-arm:
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: syncthing/syncthing:latest
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
    - target: 8384
      published: '8384'
      protocol: tcp
    - target: 22000
      published: '22000'
      protocol: tcp
    - target: 22000
      published: '22000'
      protocol: udp
    - target: 21027
      published: '21027'
      protocol: udp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/syncthing-arm
      target: /var/syncthing
    - type: bind
      source: /DATA
      target: /DATA
    container_name: syncthing-arm
