name: big-bear-gitea
services:
  big-bear-gitea:
    container_name: big-bear-gitea
    image: gitea/gitea:1.27.2@sha256:d20286ca2b2e170fdf628e7231b8a31a3220ade39ff462b55041d43d1fc757dd
    restart: unless-stopped
    ports:
    - 3000:3000
    - '2222:22'
    volumes:
    - /DATA/AppData/$AppID/data:/data
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    environment:
    - USER_UID=1000
    - USER_GID=1000
    - GITEA__server__SSH_PORT=2222
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=3
      - --spider
      - http://localhost:3000
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
