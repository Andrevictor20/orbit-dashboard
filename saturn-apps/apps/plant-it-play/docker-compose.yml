name: plant-it
services:
  plant-it:
    image: msdeluise/plant-it-server:latest
    deploy:
      resources:
        reservations:
          memory: 512M
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USERNAME: root
      MYSQL_PSW: root
      MYSQL_DATABASE: bootdb
      MYSQL_ROOT_PASSWORD: root
      JWT_SECRET: putTheSecretHere
      JWT_EXP: '1'
      USERS_LIMIT: '-1'
      UPLOAD_DIR: /upload-dir
      API_PORT: '8085'
      TREFLE_KEY: ''
      LOG_LEVEL: DEBUG
      ALLOWED_ORIGINS: '*'
      CACHE_TTL: '86400'
      CACHE_HOST: cache
      CACHE_PORT: '6379'
      SSL_ENABLED: 'false'
      CERTIFICATE_PATH: /certificates/
    depends_on:
    - db
    - cache
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/plant-it/upload-dir
      target: /upload-dir
    - type: bind
      source: /DATA/AppData/plant-it/certs
      target: /certificates
    ports:
    - target: 8085
      published: '8085'
      protocol: tcp
    - target: 3000
      published: '3000'
      protocol: tcp
    container_name: plant-it
    networks:
    - plant-it
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      MYSQL_USERNAME: root
      MYSQL_PSW: root
      MYSQL_DATABASE: bootdb
      MYSQL_ROOT_PASSWORD: root
    volumes:
    - type: bind
      source: /DATA/AppData/plant-it/db
      target: /var/lib/mysql
    container_name: plant-it-db
    networks:
    - plant-it
  cache:
    image: redis:7.2.1
    restart: unless-stopped
    container_name: plant-it-cache
    networks:
    - plant-it
networks:
  plant-it:
    name: plant-it
