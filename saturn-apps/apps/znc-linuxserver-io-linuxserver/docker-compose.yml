name: linuxserver-znc
services:
  app:
    image: linuxserver/znc:1.10.3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 6501
      published: 6501
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/znc/config
      target: /config
