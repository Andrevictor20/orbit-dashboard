name: ollama
services:
  ollama:
    container_name: ollama
    deploy:
      resources:
        reservations:
          memory: 1024M
    hostname: ollama
    image: ollama/ollama:latest
    ports:
    - 11434:11434
    restart: unless-stopped
    environment:
    - OLLAMA_ORIGINS=*
    volumes:
    - /DATA/AppData/ollama:/root/.ollama
    network_mode: bridge
    privileged: false
