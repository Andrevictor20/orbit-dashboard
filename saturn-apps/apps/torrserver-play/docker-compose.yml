name: torrserver
services:
  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: torrserver
    network_mode: host
    environment:
      TS_PORT: '5665'
      TS_DONTKILL: '1'
      TS_HTTPAUTH: '0'
      TS_CONF_PATH: /opt/ts/config
      TS_TORR_DIR: /opt/ts/torrents
    volumes:
    - /DATA/AppData/torrserver:/opt/ts
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
