id: torrserver-play
name: TorrServer
tagline: Simple and powerful tool for streaming torrents.
description: Simple and powerful tool for streaming torrents. TorrServer is a program
  that allows users to view torrents online without the need for preliminary file
  downloading. The core functionality of TorrServer includes caching torrents and
  subsequent data transfer via the HTTP protocol, allowing the cache size to be adjusted
  according to the system parameters and the user's internet connection speed.
