name: linuxserver-apprise-api
services:
  app:
    image: linuxserver/apprise-api:1.5.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    ports:
    - target: 8000
      published: 8000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/apprise-api/config
      target: /config
    - type: bind
      source: /DATA/AppData/apprise-api/attachments
      target: /attachments
