name: fileflows
services:
  fileflows:
    container_name: fileflows
    devices:
    - /dev/dri:/dev/dri
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    hostname: fileflows
    image: revenz/fileflows:stable
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/saturn-AppStore@main/Apps/FileFlows/icon.svg
    restart: unless-stopped
    ports:
    - target: 5000
      published: '19200'
      protocol: tcp
    network_mode: bridge
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /app/Data
    - type: bind
      source: /DATA/AppData/$AppID/logs
      target: /app/Logs
    - type: bind
      source: /DATA/AppData/$AppID/common
      target: /app/common
    - type: bind
      source: /DATA/AppData/$AppID/temp
      target: /temp
    - type: bind
      source: /DATA/Media
      target: /Media
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
