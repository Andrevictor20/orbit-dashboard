name: anythingllm
services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    ports:
    - published: '3001'
      target: 3001
      protocol: tcp
    cap_add:
    - SYS_ADMIN
    environment:
    - STORAGE_DIR=/app/server/storage
    - JWT_SECRET="make this a large list of random numbers and letters 20+"
    - LLM_PROVIDER=ollama
    - OLLAMA_BASE_PATH=http://172.17.0.1:11434
    - OLLAMA_MODEL_PREF=llama2
    - OLLAMA_MODEL_TOKEN_LIMIT=4096
    - EMBEDDING_ENGINE=ollama
    - EMBEDDING_BASE_PATH=http://172.17.0.1:11434
    - EMBEDDING_MODEL_PREF=nomic-embed-text:latest
    - EMBEDDING_MODEL_MAX_CHUNK_LENGTH=8192
    - VECTOR_DB=lancedb
    - WHISPER_PROVIDER=local
    - TTS_PROVIDER=native
    - PASSWORDMINCHAR=8
    - AGENT_SERPER_DEV_KEY="SERPER DEV API KEY"
    - AGENT_SERPLY_API_KEY="Serply.io API KEY"
    volumes:
    - type: bind
      source: /DATA/AppData/anythingllm/storage
      target: /app/server/storage
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
