name: linuxserver-syncthing
services:
  app:
    image: linuxserver/syncthing:2.1.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 8384
      published: 8384
      protocol: tcp
    - target: 22000
      published: 22000
      protocol: tcp
    - target: 22000
      published: 22000
      protocol: udp
    - target: 21027
      published: 21027
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/syncthing/config
      target: /config
    - type: bind
      source: /DATA/AppData/syncthing/data1
      target: /data1
    - type: bind
      source: /DATA/AppData/syncthing/data2
      target: /data2
