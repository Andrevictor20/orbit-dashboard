id: snapotter
name: SnapOtter
tagline: Self-hosted file toolkit for images, video, audio, PDFs, and files
description: 'SnapOtter is an open-source, self-hosted file manipulation suite with
  200+ tools across images, video, audio, PDFs, and files. It includes batch processing,
  reusable pipelines, local AI tools, a browser image editor, and a REST API so files
  stay on your own server.


  This package uses SnapOtter''s single-container embedded mode for an easy saturn
  install. PostgreSQL 17 and Redis 8 run inside the container when DATABASE_URL and
  REDIS_URL are left unset, with persistent data stored under /data.


  Default login is admin / admin. SnapOtter asks you to change the default password
  after first login.'
