name: linuxserver-jenkins-builder
services:
  app:
    image: linuxserver/jenkins-builder:version-4f81ddbe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/jenkins-builder/config
      target: /config
