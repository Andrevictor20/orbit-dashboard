name: mtg-proxy
services:
  mtg-proxy:
    image: nineseconds/mtg:2
    container_name: mtg-proxy
    network_mode: host
    deploy:
      resources:
        reservations:
          memory: 32M
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/mtg-proxy/config.toml
      target: /config.toml
