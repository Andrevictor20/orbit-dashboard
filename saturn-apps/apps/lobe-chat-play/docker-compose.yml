name: lobe-chat
services:
  lobe-chat:
    ports:
    - 3210:3210
    environment:
    - OPENAI_API_KEY=sk-xxxx
    - OPENAI_PROXY_URL=https://api.openai.com/v1
    - ACCESS_CODE=lobe66
    container_name: lobe-chat
    image: lobehub/lobe-chat:latest
    deploy:
      resources:
        reservations:
          memory: 128M
    restart: unless-stopped
    network_mode: bridge
