name: linuxserver-rsnapshot
services:
  app:
    image: linuxserver/rsnapshot:1.4.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/rsnapshot/config
      target: /config
    - type: bind
      source: /DATA/AppData/rsnapshot/.snapshots
      target: /.snapshots
    - type: bind
      source: /DATA/AppData/rsnapshot/data
      target: /data
