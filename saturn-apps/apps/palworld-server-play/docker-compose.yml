name: palworld-server
services:
  palworld-server:
    image: thijsvanloef/palworld-server-docker:latest
    restart: unless-stopped
    container_name: palworld-server
    ports:
    - 8211:8211/udp
    - 27015:27015/udp
    - 25575:25575/tcp
    environment:
    - PUID=1000
    - PGID=1000
    - PORT=8211
    - PLAYERS=8
    - MULTITHREADING=true
    - RCON_ENABLED=true
    - RCON_PORT=25575
    - TZ=Asia/Shanghai
    - COMMUNITY=false
    - SERVER_NAME="World of Pals"
    - SERVER_PASSWORD="worldofpals"
    - ADMIN_PASSWORD="adminPasswordHere"
    volumes:
    - /DATA/AppData/palworld-server:/palworld/
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: 4096M
