id: auto-symlink-play
name: Auto Symlink
tagline: An automation tool for cloud drive management
description: Auto_Symlink is an automation tool designed to manage cloud drives mounted
  locally through CloudDrive2/Alist. It creates symbolic links, making it easier for
  media servers like Emby/Jellyfin/Plex to scrape and read content, while reducing
  frequent access to the cloud drive.
