name: auto-symlink
services:
  auto-symlink:
    image: shenxianmq/auto_symlink:latest
    container_name: auto-symlink
    environment:
      TZ: Asia/Shanghai
    volumes:
    - type: bind
      source: /DATA/Media/Movies
      target: /Media
    - type: bind
      source: /DATA/AppData/auto-symlink/config
      target: /app/config
    ports:
    - target: 8095
      published: '8095'
      protocol: tcp
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
