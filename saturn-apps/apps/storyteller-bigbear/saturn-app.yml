name: Storyteller
tagline: Self-hosted ebook reading platform
description: Storyteller is a self-hosted platform for ebook reading and library management.
  It supports multiple ebook formats including EPUB, PDF, and MOBI. Features include
  a modern web-based reader, library organization, metadata management, and multi-user
  support. Built with Django and includes optional Readium reader integration for
  enhanced reading experience.
