description: WordPress (also known as WP or WordPress.org) is a web content management
  system. It was originally created as a tool to publish blogs but has evolved to
  support publishing other web content, including more traditional websites, mailing
  lists and Internet forum, media galleries, membership sites, learning management
  systems and online stores. Available as free and open-source software, WordPress
  is among the most popular content management systems – it was used by 43.1% of the
  top 10 million websites as of December 2023.
