id: electerm-play
name: Electerm
tagline: A Secure and Feature-Rich Terminal Client
description: Electerm is an open-sourced terminal/ssh/telnet/serialport/RDP/VNC/sftp
  client(linux, mac, win). It supports features like global hotkeys, multi-platform
  support, multiple language support, direct editing of remote files, password or
  key login, Zmodem(rz, sz), ssh tunneling, Trzsz(trz/tsz), transparent window, custom
  background image, proxy server, preset commands, themes, data synchronization to
  Github/Gitee, quick command input, AI assistant integration, and command-line usage.
category: Productivity
