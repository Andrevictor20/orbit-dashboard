name: linuxserver-faster-whisper
services:
  app:
    image: linuxserver/faster-whisper:3.8.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DEBUG: ''
      LOCAL_ONLY: ''
      WHISPER_BEAM: ''
      WHISPER_LANG: ''
      WHISPER_MODEL: ''
    ports:
    - target: 10300
      published: 10300
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/faster-whisper/config
      target: /config
