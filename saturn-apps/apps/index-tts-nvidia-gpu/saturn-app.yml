id: index-tts-nvidia-gpu
name: Index-TTS(Nvidia GPU)
tagline: An Industrial-Level Controllable and Efficient Zero-Shot Text-To-Speech System
description: 'IndexTTS2 is an advanced zero-shot text-to-speech model that innovatively
  achieves complete decoupling of emotional expression and speaker identity. The model
  supports precise speech duration control and multimodal emotion control, capable
  of maintaining the target timbre while accurately reproducing the specified emotional
  intonation.


  The model employs a three-stage training paradigm and introduces GPT latent representations,
  ensuring excellent speech clarity and stability even under high emotional expression.
  Through the Qwen-based soft instruction mechanism, users can easily control the
  emotional characteristics of generated speech using natural language descriptions.


  In multi-dataset evaluations, IndexTTS2 surpasses existing zero-shot TTS models
  in key metrics such as word error rate, speaker similarity, and emotion fidelity,
  providing industry-leading speech synthesis quality.


  **Key Features:**

  - Zero-shot TTS capability to replicate any timbre without training

  - Independent control of emotion and timbre with multimodal emotion input

  - Precise duration control with explicit token count specification for perfect audio-video
  synchronization

  - Natural language-based emotion control to guide speech generation through text
  descriptions


  **Prerequisites:**

  - Please ensure available memory > 12 GB, otherwise the application may not run
  properly

  - NVIDIA GPU with ≥ 8 GB VRAM (recommended for optimal performance)

  - NVIDIA CUDA Toolkit version ≥ 12.8


  **Learn More:**

  - [IndexTTS GitHub](https://github.com/index-tts/index-tts)'
