name: linuxserver-mysql-workbench
services:
  app:
    image: linuxserver/mysql-workbench:8.0.47
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/mysql-workbench/config
      target: /config
