name: libretv
services:
  libretv:
    image: bestzwei/libretv:latest
    container_name: libretv
    ports:
    - 8899:8080
    environment:
      PASSWORD: your_password
      ADMINPASSWORD: your_adminpassword
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
