id: lanraragi-play
name: LANraragi
tagline: Archival and reading of manga/doujinshi
description: LANraragi is a versatile comic archive management tool that supports
  various formats such as zip, rar, targz, lzma, 7z, xz, cbz, cbr, and pdf, with basic
  support for epub. Users can seamlessly read their comic archives directly from a
  web browser, as the server efficiently accesses compressed files using temporary
  folders.
category: Media
version: 1.0.0
developer: Difegue
store: play
icon: icon.png
port: 3000
architectures:
- amd64
- arm
- arm64
