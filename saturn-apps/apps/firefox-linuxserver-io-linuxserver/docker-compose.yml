name: linuxserver-firefox
services:
  app:
    image: linuxserver/firefox:1155.0.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FIREFOX_CLI: ''
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/firefox/config
      target: /config
