name: dpanel
services:
  dpanel:
    image: dpanel/dpanel:latest
    container_name: dpanel
    restart: unless-stopped
    ports:
    - 8807:8080
    - 4443:443
    - 8081:80
    environment:
      APP_NAME: dpanel
      INSTALL_USERNAME: admin
      INSTALL_PASSWORD: admin
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /DATA/AppData/dpanel:/dpanel
    - /var/lib/saturn/apps:/var/lib/saturn/apps
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
