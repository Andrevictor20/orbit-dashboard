name: qui
services:
  qui:
    container_name: qui
    image: ghcr.io/autobrr/qui:v1.28.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          memory: 128M
    ports:
    - 7476:7476
    volumes:
    - /DATA/AppData/$AppID/qui:/config
    environment:
      QUI__DATABASE_ENGINE: postgres
      QUI__DATABASE_DSN: postgres://qui:qui@qui-postgres:5432/qui?sslmode=disable
    networks:
    - qui_network
  postgres:
    container_name: qui-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 128M
    environment:
      POSTGRES_USER: qui
      POSTGRES_PASSWORD: qui
      POSTGRES_DB: qui
    volumes:
    - /DATA/AppData/$AppID/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - qui_network
networks:
  qui_network:
    driver: bridge
