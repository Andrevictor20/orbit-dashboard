name: linuxserver-jellyfin
services:
  app:
    image: linuxserver/jellyfin:10.11.11
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      JELLYFIN_PublishedServerUrl: ''
    ports:
    - target: 8096
      published: 8096
      protocol: tcp
    - target: 8920
      published: 8920
      protocol: tcp
    - target: 7359
      published: 7359
      protocol: udp
    - target: 1900
      published: 1900
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/jellyfin/config
      target: /config
    - type: bind
      source: /DATA/AppData/jellyfin/data/tvshows
      target: /data/tvshows
    - type: bind
      source: /DATA/AppData/jellyfin/data/movies
      target: /data/movies
