name: cloudflared
services:
  cloudflared:
    image: wisdomsky/cloudflared-web:2026.5.0
    restart: unless-stopped
    network_mode: host
    ports:
    - target: 14333
      published: '14333'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/saturn-cloudflared/config
      target: /config
    container_name: cloudflared
