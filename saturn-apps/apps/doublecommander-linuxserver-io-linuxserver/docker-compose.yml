name: linuxserver-doublecommander
services:
  app:
    image: linuxserver/doublecommander:arm64v8-version-47f5ef2f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    - target: 3001
      published: 3001
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/doublecommander/config
      target: /config
    - type: bind
      source: /DATA/AppData/doublecommander/data
      target: /data
