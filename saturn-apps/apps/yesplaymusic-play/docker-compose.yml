name: yesplaymusic
services:
  yesplaymusic:
    image: fogforest/yesplaymusic
    container_name: yesplaymusic
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: bridge
    ports:
    - target: 80
      published: 3000
      protocol: tcp
    restart: unless-stopped
