name: linuxserver-wireguard
services:
  app:
    image: linuxserver/wireguard:1.0.20260223
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SERVERURL: ''
      SERVERPORT: ''
      PEERS: ''
      PEERDNS: ''
      INTERNAL_SUBNET: ''
      ALLOWEDIPS: ''
      PERSISTENTKEEPALIVE_PEERS: ''
      LOG_CONFS: ''
    ports:
    - target: 51820
      published: 51820
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/wireguard/config
      target: /config
    - type: bind
      source: /lib/modules
      target: /lib/modules
