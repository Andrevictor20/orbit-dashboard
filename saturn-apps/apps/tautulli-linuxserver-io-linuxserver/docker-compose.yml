name: linuxserver-tautulli
services:
  app:
    image: linuxserver/tautulli:2.18.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 8181
      published: 8181
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/tautulli/config
      target: /config
