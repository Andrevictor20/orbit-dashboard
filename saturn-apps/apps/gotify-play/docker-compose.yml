name: gotify
services:
  gotify:
    image: gotify/server:latest
    container_name: gotify
    deploy:
      resources:
        reservations:
          memory: 16M
    network_mode: bridge
    ports:
    - target: 80
      published: '86'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/gotify
      target: /app/data
