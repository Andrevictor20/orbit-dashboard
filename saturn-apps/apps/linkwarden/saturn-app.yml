id: linkwarden
name: Linkwarden
tagline: Self-hosted collaborative bookmark manager to collect, read, annotate, and
  fully preserve what matters, all in one place.
description: 'Linkwarden is an open-source self-hosted bookmark and web archive manager
  designed to help users collect, organize, and preserve important online content
  in one place. In addition to traditional bookmarking capabilities, it provides full
  webpage backup so valuable information remains safely accessible over time.


  Built around long-term content preservation, Linkwarden can automatically capture
  webpage screenshots, PDFs, and full HTML files to help prevent link rot. It also
  includes reading mode, annotations, local AI-powered tagging, full-text search,
  and a multi-level classification system for smarter and more efficient information
  management. Its modular architecture supports self-hosting, browser extensions,
  and cross-device sync.


  In practice, Linkwarden is suitable not only for personal knowledge management and
  content collection, but also for team collaboration and shared curation. With collections
  and permission controls, users can organize content together and manage it publicly
  or privately. It is a modern bookmarking tool that balances data ownership, security,
  and collaboration.


  **Key Features:**


  - Full webpage archiving (screenshots, PDFs, HTML) to prevent link rot

  - AI-powered auto-tagging and full-text search

  - Reading mode, text highlighting, and annotations

  - Multi-level categories and tags for flexible organization

  - Team collaboration and permission management


  **Learn more:**


  - [Linkwarden GitHub](https://github.com/linkwarden/linkwarden)'
