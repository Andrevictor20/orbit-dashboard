name: linuxserver-wikijs
services:
  app:
    image: linuxserver/wikijs:2.5.314
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: ''
      DB_HOST: ''
      DB_PORT: ''
      DB_NAME: ''
      DB_USER: ''
      DB_PASS: ''
    ports:
    - target: 3000
      published: 3000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/wikijs/config
      target: /config
    - type: bind
      source: /DATA/AppData/wikijs/data
      target: /data
