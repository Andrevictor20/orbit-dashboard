name: linuxserver-changedetection.io
services:
  app:
    image: linuxserver/changedetection.io:0.60.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    ports:
    - target: 5000
      published: 5000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/changedetection.io/config
      target: /config
