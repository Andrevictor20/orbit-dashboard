name: medusa
services:
  medusa:
    container_name: medusa
    deploy:
      resources:
        limits:
          memory: 7848M
    environment:
    - TZ= $TZ
    image: pymedusa/medusa:master
    ports:
    - target: 8081
      published: '8081'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/Downloads/Television
      target: /downloads
    - type: bind
      source: /DATA/AppData/$AppID/Media/Television
      target: /tv
    network_mode: bridge
    privileged: false
