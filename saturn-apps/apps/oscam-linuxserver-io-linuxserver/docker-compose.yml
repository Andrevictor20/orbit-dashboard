name: linuxserver-oscam
services:
  app:
    image: linuxserver/oscam:version-11966
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 8888
      published: 8888
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/oscam/config
      target: /config
