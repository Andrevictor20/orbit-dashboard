name: tautulli-arm
services:
  tautulli-arm:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: Europe/London
    image: linuxserver/tautulli:arm32v7-2.12.4
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 8181
      published: '8181'
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/tautulli-arm/config
      target: /config
    container_name: tautulli-arm
