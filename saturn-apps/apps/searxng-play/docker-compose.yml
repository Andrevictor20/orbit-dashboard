name: searxng
services:
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    network_mode: bridge
    ports:
    - 8888:8080
    volumes:
    - /DATA/AppData/searxng/config:/etc/searxng
    environment:
    - SEARXNG_BASE_URL=http://localhost:8888
    - UWSGI_WORKERS=4
    - UWSGI_THREADS=4
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    deploy:
      resources:
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '1'
