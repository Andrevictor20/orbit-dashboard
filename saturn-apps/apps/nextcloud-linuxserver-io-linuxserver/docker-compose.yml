name: linuxserver-nextcloud
services:
  app:
    image: linuxserver/nextcloud:34.0.4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 443
      published: 443
      protocol: tcp
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/nextcloud/config
      target: /config
    - type: bind
      source: /DATA/AppData/nextcloud/data
      target: /data
