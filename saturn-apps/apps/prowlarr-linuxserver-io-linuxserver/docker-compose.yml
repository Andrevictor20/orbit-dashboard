name: linuxserver-prowlarr
services:
  app:
    image: linuxserver/prowlarr:2.5.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 9696
      published: 9696
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/prowlarr/config
      target: /config
