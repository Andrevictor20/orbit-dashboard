name: linuxserver-boinc
services:
  app:
    image: linuxserver/boinc:8.2.8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
    ports:
    - target: 8080
      published: 8080
      protocol: tcp
    - target: 8181
      published: 8181
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/boinc/config
      target: /config
