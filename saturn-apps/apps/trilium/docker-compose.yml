name: trilium
services:
  trilium:
    command: []
    container_name: trilium
    deploy:
      resources:
        reservations:
          memory: 256M
    image: triliumnext/trilium:v0.103.0
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/saturn-AppStore@main/Apps/Trilium/icon.svg
    ports:
    - target: 8080
      published: '8088'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID
      target: /home/node/trilium-data
    network_mode: bridge
    privileged: false
