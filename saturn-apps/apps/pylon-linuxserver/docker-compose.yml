name: linuxserver-pylon
services:
  app:
    image: linuxserver/pylon:2.10.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      GITURL: ''
      PYUSER: ''
      PYPASS: ''
    ports:
    - target: 3131
      published: 3131
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/pylon/config
      target: /config
    - type: bind
      source: /DATA/AppData/pylon/code
      target: /code
