name: baidunetdisk
services:
  baidunetdisk:
    image: emuqi/baidunetdisk-arm64-vnc:latest
    container_name: baidunetdisk
    deploy:
      resources:
        reservations:
          memory: 1024M
    ports:
    - 5800:5800
    - 5900:5900
    volumes:
    - /DATA/AppData/baidunetdisk/config:/config
    - /DATA/Downloads:/config/Downloads
    environment:
    - VNC_PASSWORD=vncpassword
    restart: unless-stopped
    network_mode: bridge
    privileged: false
