name: rocket-chat
services:
  app:
    image: rocket.chat:8.8.1
    restart: unless-stopped
    environment:
      MONGO_OPLOG_URL: mongodb://db:27017/local
    depends_on:
    - db
    ports:
    - target: 3000
      published: '3000'
      protocol: tcp
  db:
    image: mongo:8.3.11
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
    - type: bind
      source: /DATA/AppData/rocket-chat/mongo/data/configdb
      target: /data/configdb
    - type: bind
      source: /DATA/AppData/rocket-chat/mongo/data/db
      target: /data/db
