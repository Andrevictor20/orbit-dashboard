name: v2raya
services:
  v2raya:
    environment:
      V2RAYA_ADDRESS: 0.0.0.0:2017
    image: mzz2017/v2raya:latest
    container_name: v2raya
    deploy:
      resources:
        reservations:
          memory: 128M
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
    - type: bind
      source: /etc/resolv.conf
      target: /etc/resolv.conf
    - type: bind
      source: /DATA/AppData/v2raya
      target: /etc/v2raya
    - type: bind
      source: /lib/modules
      target: /lib/modules
