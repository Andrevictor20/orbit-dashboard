name: linuxserver-monica
services:
  app:
    image: linuxserver/monica:4.1.2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_HOST: ''
      DB_PORT: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_DATABASE: ''
      APP_URL: ''
      TRUSTED_PROXIES: ''
      APP_ENV: ''
      APP_DISABLE_SIGNUP: ''
    ports:
    - target: 80
      published: 80
      protocol: tcp
    - target: 443
      published: 443
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/monica/config
      target: /config
