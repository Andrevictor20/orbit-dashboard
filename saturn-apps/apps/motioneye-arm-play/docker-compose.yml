name: motioneye-arm
services:
  motioneye-arm:
    container_name: motioneye-arm
    image: ccrisan/motioneye:master-armhf
    ports:
    - target: 8765
      published: '8765'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/motioneye/config
      target: /etc/motioneye
    - type: bind
      source: /DATA/Media/motioneye
      target: /var/lib/motioneye
    network_mode: bridge
    privileged: false
