name: overseerr-arm
services:
  overseerr-arm:
    image: linuxserver/overseerr:arm32v7-1.32.5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 5055
      published: 5055
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/overseerr/config
      target: /config
    container_name: overseerr-arm
    network_mode: bridge
