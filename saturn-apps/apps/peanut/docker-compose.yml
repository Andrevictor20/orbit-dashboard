name: peanut
services:
  peanut:
    image: brandawg93/peanut:6.0.0
    container_name: PeaNUT
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    ports:
    - target: 8080
      published: '8084'
      protocol: tcp
    environment:
      WEB_PORT: 8080
    deploy:
      resources:
        reservations:
          memory: 256M
