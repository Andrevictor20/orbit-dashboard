name: linuxserver-babybuddy
services:
  app:
    image: linuxserver/babybuddy:2.10.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    ports:
    - target: 8000
      published: 8000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/babybuddy/config
      target: /config
