name: windows
services:
  windows:
    image: dockurr/windows:latest
    container_name: windows
    environment:
      VERSION: '11'
      USERNAME: Docker
      PASSWORD: admin
      LANGUAGE: English
      DISK_SIZE: 64G
      RAM_SIZE: 4G
      CPU_CORES: '2'
    devices:
    - /dev/kvm
    - /dev/net/tun
    cap_add:
    - NET_ADMIN
    ports:
    - 8006:8006
    - 3389:3389/tcp
    - 3389:3389/udp
    volumes:
    - /DATA/AppData/windows:/storage
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G
    stop_grace_period: 2m
