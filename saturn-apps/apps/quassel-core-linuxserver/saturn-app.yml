id: quassel-core-linuxserver
name: Quassel core
tagline: A modern, cross-platform, distributed IRC client, meaning that one (or multiple)
  client(s) can attach to and detach from a central core. This container handles the
  IRC connection (quasselcore) and requires a desktop client (quasselclient) to be
  used and configured. It is designed to be always on and will keep your identity
  present in IRC even when your clients cannot be online. Backlog (history) is downloaded
  by your client upon reconnection allowing infinite scrollback through time.
description: 'Visit homepage: https://hub.docker.com/r/linuxserver/quassel-core/'
category: LinuxServer.io
version: 1.0.0
developer: LinuxServer.io
store: linuxserver
icon: icon.png
architectures:
- amd64
- arm64
