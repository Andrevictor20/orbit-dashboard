id: swag-linuxserver-io-linuxserver
name: Swag (LinuxServer.io)
tagline: SWAG - Secure Web Application Gateway (formerly known as letsencrypt, no
  relation to Let's Encrypt™) sets up an Nginx webserver and reverse proxy with php
