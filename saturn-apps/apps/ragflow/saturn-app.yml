id: ragflow
name: RagFlow
tagline: RagFlow is an open-source RAG engine based on deep document understanding.
description: 'RagFlow is an open-source RAG (Retrieval-Augmented Generation) engine
  based on deep document understanding. It enables users to build their own private
  ChatGPT by leveraging the power of large language models and deep document parsing
  capabilities. RagFlow supports various document formats including PDF, Word, Markdown,
  and more, allowing users to create intelligent question-answering systems based
  on their own documents.


  **Key Features:**

  - Deep document understanding with advanced parsing capabilities

  - Support for multiple document formats (PDF, Word, Markdown, etc.)

  - Private knowledge base with data security assurance

  - Customizable RAG workflows for different use cases

  - Integration with popular large language models

  - Web-based interface for easy management and interaction


  **Hardware Requirements:**

  - CPU >= 4 cores

  - RAM >= 16 GB

  - Disk >= 50 GB


  **Learn More:**

  - [RagFlow Official Website](https://ragflow.io)

  - [RagFlow GitHub Repository](https://github.com/infiniflow/ragflow)'
