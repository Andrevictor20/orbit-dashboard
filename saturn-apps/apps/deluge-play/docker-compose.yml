name: deluge-arm
services:
  deluge-arm:
    environment:
      DELUGE_LOGLEVEL: error
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: linuxserver/deluge:arm32v7-2.1.1
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
    - target: 8112
      published: '8112'
      protocol: tcp
    - target: 6881
      published: '6881'
      protocol: tcp
    - target: 6881
      published: '6881'
      protocol: udp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/deluge-arm/config
      target: /config
    - type: bind
      source: /DATA
      target: /DATA
    container_name: deluge-arm
