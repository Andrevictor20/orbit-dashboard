name: linuxserver-build-agent
services:
  app:
    image: linuxserver/build-agent:version-0296acb5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/build-agent/config
      target: /config
