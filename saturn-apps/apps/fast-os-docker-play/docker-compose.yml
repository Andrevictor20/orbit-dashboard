name: fastosdocker
services:
  fastosdocker:
    environment:
      FAST_STORE: http://dockernb.com:8300
    image: wangbinxingkong/fast:latest
    container_name: fastosdocker
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
    - target: 8081
      published: '8081'
      protocol: tcp
    - target: 8082
      published: '8082'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - type: bind
      source: /etc/docker/
      target: /etc/docker/
    - type: bind
      source: /DATA/AppData/fastosdocker/data
      target: /fast/data
    network_mode: bridge
