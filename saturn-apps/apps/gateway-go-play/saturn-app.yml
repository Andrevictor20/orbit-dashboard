id: gateway-go-play
name: Gateway-go
tagline: A fast reverse proxy to help you expose a local server behind a NAT or firewall
  to your client.
description: 'A fast reverse proxy to help you expose a local server behind a NAT
  or firewall to your client.


  Use OpenIoTHub to scan the following QR code and add a gateway, then add host, add
  host''s port, finally, enjoy remote control


  At present, the APP supports native interface access to saturn/Zima''s main functions,
  including installing applications,


  managing installed applications (including: starting, stopping, remote intranet
  penetration access to all installed applications,


  etc.), and viewing system status. In the future, it will support native interface
  APP access such as DPanel and remote access for installing applications'
