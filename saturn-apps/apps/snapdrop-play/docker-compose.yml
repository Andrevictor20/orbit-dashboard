name: snapdrop-arm
services:
  snapdrop-arm:
    environment:
    - PGID=$PGID
    - PUID=$PUID
    - TZ=$TZ
    image: linuxserver/snapdrop:arm32v7-version-eac78009
    network_mode: bridge
    ports:
    - target: 443
      published: '443'
      protocol: tcp
    - target: 80
      published: '89'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/snapdrop-arm/config
      target: /config
    privileged: false
    container_name: snapdrop-arm
