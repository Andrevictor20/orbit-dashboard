name: FileCodeBox
tagline: Anonymous Passcode Sharing Files
description: FileCodeBox is a simple and easy-to-use file sharing platform that allows
  you to share files and texts anonymously without registration. Users can upload
  files by copying, pasting or dragging and dropping, and enjoy the security of password
  sharing, error count limit and IP upload count limit. It supports multi-language,
  one-click docker deployment, and free to expand the storage engine.
