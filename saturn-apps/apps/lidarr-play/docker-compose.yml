name: lidarr-arm
services:
  lidarr-arm:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: Europe/London
    image: linuxserver/lidarr:arm32v7-1.1.4
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 8686
      published: '8686'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/lidarr/config
      target: /config
    - type: bind
      source: /DATA/Media/Music
      target: /music
    - type: bind
      source: /DATA/Downloads
      target: /downloads
    container_name: lidarr-arm
