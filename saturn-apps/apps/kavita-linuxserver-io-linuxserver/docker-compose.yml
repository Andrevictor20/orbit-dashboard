name: linuxserver-kavita
services:
  app:
    image: linuxserver/kavita:0.9.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 5000
      published: 5000
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/kavita/config
      target: /config
    - type: bind
      source: /DATA/AppData/kavita/data
      target: /data
