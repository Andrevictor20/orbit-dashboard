name: cloudflared-web
services:
  cloudflared:
    image: wisdomsky/cloudflared-web:2026.9.1
    restart: unless-stopped
    network_mode: host
    ports:
    - target: 14333
      published: '14333'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/cloudflared-web/config
      target: /config
