name: sabnzbd-arm
services:
  sabnzbd-arm:
    environment:
      PGID: '1000'
      PUID: '1000'
      TZ: Europe/London
    image: linuxserver/sabnzbd:arm32v7-4.0.1
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 8080
      published: '8282'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/Downloads
      target: /incomplete-downloads
    - type: bind
      source: /DATA/AppData/sabnzbd/config
      target: /config
    - type: bind
      source: /DATA/Downloads
      target: /downloads
    container_name: sabnzbd-arm
