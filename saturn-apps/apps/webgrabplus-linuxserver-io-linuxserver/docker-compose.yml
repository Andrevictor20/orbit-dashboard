name: linuxserver-webgrabplus
services:
  app:
    image: linuxserver/webgrabplus:5.6.1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/webgrabplus/config
      target: /config
    - type: bind
      source: /DATA/AppData/webgrabplus/data
      target: /data
