name: glances
services:
  glances:
    image: nicolargo/glances:latest-full
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    restart: unless-stopped
    ports:
    - target: 61208
      published: '61208'
      protocol: tcp
    - target: 61209
      published: '61209'
      protocol: tcp
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    environment:
    - TZ=$TZ
    - GLANCES_OPT=-w
    pid: host
    container_name: glances
    hostname: saturn
