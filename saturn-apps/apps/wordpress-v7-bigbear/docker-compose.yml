name: big-bear-wordpress-v7
services:
  app:
    image: wordpress:7.0.2@sha256:b2d7e3153c8a96f90305a3102fb6439335237fb1a9655b617d15c5168ce2f7a3
    ports:
    - 8084:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: saturn
      WORDPRESS_DB_PASSWORD: saturn
      WORDPRESS_DB_NAME: wordpress
    volumes:
    - /DATA/AppData/$AppID/html:/var/www/html
    depends_on:
    - db
  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: saturn
      MYSQL_PASSWORD: saturn
      MYSQL_ROOT_PASSWORD: saturn
    volumes:
    - /DATA/AppData/$AppID/mysql:/var/lib/mysql
