id: turbodiffusion-nvidia-gpu
name: TurboDiffusion(Nvidia GPU)
tagline: An accelerated video generation framework that speeds up end-to-end diffusion
  while preserving video quality
description: 'TurboDiffusion is an accelerated text-to-video generation framework
  based on the Latent Consistency Model (LCM). It leverages various TurboWan2 models
  to rapidly generate high-quality videos from text descriptions. The framework supports
  both image and video generation and provides optimized checkpoints for different
  GPU configurations.


  **Key Features:**

  - Ultra-fast video and image generation

  - Intuitive Gradio WebUI

  - Optimized for different GPU configurations

  - Quantized and unquantized checkpoints

  - Flexible model configuration


  **Hardware Requirements:**

  - Recommended: RTX 3090 or above

  - GPU VRAM: > 30 GB

  - System RAM: > 40 GB

  - CUDA-compatible NVIDIA drivers


  **Learn More:**

  - [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)'
