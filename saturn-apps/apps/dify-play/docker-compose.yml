      \ /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod\
      \ +x /docker-entrypoint.sh && /docker-entrypoint.sh"
    environment:
      HTTP_PORT: '3128'
      COREDUMP_DIR: /var/spool/squid
      REVERSE_PROXY_PORT: '8194'
      SANDBOX_HOST: sandbox
      SANDBOX_PORT: '8194'
    networks:
    - ssrf_proxy_network
    - dify
    depends_on:
    - init
  nginx:
    container_name: dify-nginx
    image: nginx:latest
    restart: unless-stopped
    volumes:
    - /DATA/AppData/dify/nginx:/init
    - /DATA/AppData/dify/nginx/conf.d:/etc/nginx/conf.d
    - /DATA/AppData/dify/nginx/ssl:/etc/ssl
    entrypoint:
    - sh
    - -c
    - "cp /init/*.template /etc/nginx && cp /init/docker-entrypoint.sh /docker-entrypoint.sh\
      \ && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh\
      \ && /docker-entrypoint.sh"
    environment:
      NGINX_SERVER_NAME: _
      NGINX_HTTPS_ENABLED: 'false'
      NGINX_SSL_PORT: '443'
      NGINX_PORT: '80'
      NGINX_SSL_CERT_FILENAME: dify.crt
      NGINX_SSL_CERT_KEY_FILENAME: dify.key
      NGINX_SSL_PROTOCOLS: TLSv1.1 TLSv1.2 TLSv1.3
      NGINX_WORKER_PROCESSES: auto
      NGINX_CLIENT_MAX_BODY_SIZE: 15M
      NGINX_KEEPALIVE_TIMEOUT: '65'
      NGINX_PROXY_READ_TIMEOUT: 3600s
      NGINX_PROXY_SEND_TIMEOUT: 3600s
      NGINX_ENABLE_CERTBOT_CHALLENGE: 'false'
      CERTBOT_DOMAIN: your_domain.com
    depends_on:
    - api
    - web
    - init
    ports:
    - 6080:80
    networks:
    - dify
  weaviate:
    container_name: dify-weaviate
    image: semitechnologies/weaviate:1.19.0
    profiles:
    - ''
    - weaviate
    restart: unless-stopped
    volumes:
    - /DATA/AppData/dify/volumes/weaviate:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: '25'
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai
      AUTHORIZATION_ADMINLIST_ENABLED: 'true'
      AUTHORIZATION_ADMINLIST_USERS: hello@dify.ai
    networks:
    - dify
networks:
  ssrf_proxy_network:
    driver: bridge
    internal: true
  dify:
    name: dify
