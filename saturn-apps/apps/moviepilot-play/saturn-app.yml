name: MoviePilot
tagline: NAS Media Library Automation Management Tool
description: MoviePilot is a video management tool that can automatically download
  and manage movies. **The MoviePilot V1 version stops feature updates, only fixes
  major bugs and simultaneously updates site resource packs. The V2 version has added
  a number of new features. Some functions have been redesigned and developed using
  independent scenarios. They cannot be automatically upgraded through the V1 version.
  They are also incompatible with the configuration and database files of the old
  version.**
