name: qinglong
services:
  qinglong:
    image: whyour/qinglong:latest
    container_name: qinglong
    deploy:
      resources:
        reservations:
          memory: 256M
    network_mode: bridge
    ports:
    - target: 5700
      published: '5700'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/ql
      target: /ql/data
