name: linuxserver-embystat
services:
  app:
    image: linuxserver/embystat:0.2.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 6555
      published: 6555
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/embystat/config
      target: /config
