name: tailscale-derper
services:
  tailscale-derper:
    environment:
      DERP_ADDR: :443
      DERP_CERT_MODE: manual
      DERP_DOMAIN: xxx.com
    image: fredliang/derper:latest
    container_name: tailscale-derper
    deploy:
      resources:
        reservations:
          memory: 32M
    network_mode: bridge
    ports:
    - target: 443
      published: '3443'
      protocol: tcp
    - target: 3478
      published: '3478'
      protocol: udp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/derper/certs
      target: /app/certs
