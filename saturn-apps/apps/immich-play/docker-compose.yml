name: immich
services:
  immich:
    deploy:
      resources:
        reservations:
          memory: 1024M
    container_name: immich
    image: altran1502/immich-server:release
    volumes:
    - /DATA/Gallery/immich:/data
    - /etc/localtime:/etc/localtime:ro
    environment:
      DB_DATABASE_NAME: immich
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
    ports:
    - 2283:2283
    depends_on:
    - redis
    - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
    - immich
  immich-machine-learning:
    container_name: immich-machine-learning
    image: altran1502/immich-machine-learning:release
    volumes:
    - /DATA/AppData/immich/model-cache:/cache
    environment:
      DB_DATABASE_NAME: immich
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
    - immich
  redis:
    container_name: immich-redis
    image: valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
    - immich
  database:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:8d292bdb796aa58bbbaa47fe971c8516f6f57d6a47e7172e62754feb6ed4e7b0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
    - /DATA/AppData/immich/pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    networks:
    - immich
networks:
  immich:
    name: immich
