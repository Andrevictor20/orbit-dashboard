id: copyparty
name: CopyParty
tagline: A simple, private file server.
description: '**CopyParty** is a fast, privacy-focused file sharing server using a
  local-first, single-file architecture, ensuring full control over data without cloud
  dependencies. Its intuitive interface supports offline use, with cross-platform
  compatibility and multi-protocol access, delivering a secure, efficient file management
  experience, ideal for users seeking direct data ownership and a lightweight solution.


  The app''s core features include accelerated resumable uploads (via the up2k protocol),
  ensuring reliable large file transfers, and automatic deduplication to optimize
  storage. It helps users organize folders and media effortlessly, with a web-based
  file manager that includes a built-in media indexer and thumbnail generator for
  quick previews. Fine-grained permission controls allow specific user access rules.
  The "upload-while-downloading" feature enhances sharing efficiency, and the zero-dependency
  design ensures it runs on almost any hardware.


  It integrates multiple access protocols, including HTTP, WebDAV, FTP, and TFTP,
  supporting connections from standard web browsers, dedicated file clients, and legacy
  hardware (such as PSP). The app supports Docker and Python for deployment, simplifying
  setup across various server environments. It facilitates seamless access to local
  files without complex configuration. Community documentation enhances usability,
  and the app''s simple operation and high flexibility deliver a modern local file
  service solution.


  **Key Features:**

  - Privacy-focused local file sharing

  - Zero-dependency single-file architecture

  - Accelerated resumable uploads

  - Multi-protocol support (HTTP, WebDAV, FTP, etc.)

  - Cross-platform compatibility

  - Media indexing and streaming

  - Smart deduplication

  - User permission management


  **Learn More:**

  - [CopyParty GitHub Repository](https://github.com/9001/copyparty)'
