name: linuxserver-duckdns
services:
  app:
    image: linuxserver/duckdns:version-73f1bc7d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SUBDOMAINS: ''
      TOKEN: ''
      UPDATE_IP: ''
      LOG_FILE: ''
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/duckdns/config
      target: /config
    - type: bind
      source: /DATA/AppData/duckdns/config
      target: /config
