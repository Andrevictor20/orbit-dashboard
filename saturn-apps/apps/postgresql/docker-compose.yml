name: postgresql
services:
  postgresql:
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: saturn
      POSTGRES_PASSWORD: saturn
      POSTGRES_DB: saturn
    image: postgres:17.4
    deploy:
      resources:
        reservations:
          memory: 2048M
    restart: unless-stopped
    ports:
    - target: 5432
      published: '5432'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/postgresql/data
      target: /var/lib/postgresql/data
    container_name: postgresql
