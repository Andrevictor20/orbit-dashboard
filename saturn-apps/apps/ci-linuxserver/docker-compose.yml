name: linuxserver-ci
services:
  app:
    image: linuxserver/ci:b1ca9f98-ls65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/ci/config
      target: /config
