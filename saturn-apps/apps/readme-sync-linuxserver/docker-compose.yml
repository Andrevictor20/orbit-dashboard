name: linuxserver-readme-sync
services:
  app:
    image: linuxserver/readme-sync:84f2d0c3-ls27
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/readme-sync/config
      target: /config
