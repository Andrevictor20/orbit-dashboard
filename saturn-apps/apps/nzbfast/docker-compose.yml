name: nzbfast
services:
  nzbfast:
    image: nzbfast/nzbfast:1.3.1
    container_name: nzbfast
    network_mode: bridge
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      NZBFAST_APIKEY: ''
    ports:
    - target: 6789
      published: '6790'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /config
    - type: bind
      source: /DATA/AppData/$AppID/watch
      target: /watch
    - type: bind
      source: /DATA/Downloads
      target: /downloads
    deploy:
      resources:
        reservations:
          memory: 128M
