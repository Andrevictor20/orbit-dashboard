name: linuxserver-nntp2nntp
services:
  app:
    image: linuxserver/nntp2nntp:0.3.20230704
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 1563
      published: 1563
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/nntp2nntp/config
      target: /config
