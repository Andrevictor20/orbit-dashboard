id: psitransfer
name: PsiTransfer
tagline: A simple, open-source file sharing host.
description: 'PsiTransfer is a simple, self-hosted open-source file sharing service
  that allows you to share files securely and easily without registration.


  **Key Features:**

  - **No Registration Required:** Share files instantly without creating an account.

  - **Privacy and Control:** All files are stored on your own server, giving you complete
  control over your data.

  - **Password Protection:** Protect shared files with a password for enhanced security.

  - **Upload Expiry:** Set uploaded files to automatically expire after a specific
  time to save storage space.

  - **Admin Panel:** Manage all uploads through a clean admin panel.

  - **Delivery Target:** Send files to predefined email addresses (configuration required).

  - **Responsive Web Interface:** Clean and user-friendly interface that works perfectly
  on all devices.


  **Learn More:**

  - [PsiTransfer GitHub Repository](https://github.com/psi-4ward/psitransfer)'
