name: bentopdf
services:
  bentopdf:
    container_name: bentopdf
    image: ghcr.io/alam00000/bentopdf-simple:2.8.8
    network_mode: bridge
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 64M
    ports:
    - target: 8080
      published: '3000'
      protocol: tcp
    environment:
      PUID: $PUID
      PGID: $PGID
      DISABLE_IPV6: 'false'
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8080
      interval: 30s
      timeout: 10s
      retries: 3
