name: traefik-v1
services:
  traefik-v1:
    container_name: traefik-v1
    command: --api --docker
    image: traefik:v1.7
    labels:
      icon: https://raw.githubusercontent.com/mr-manuel/saturn-HomeAutomation-AppStore/latest/Apps/Traefik-v1/icon.png
    network_mode: bridge
    ports:
    - target: 80
      published: '81'
      protocol: tcp
    - target: 443
      published: '443'
      protocol: tcp
    - target: 8080
      published: '8080'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /etc/traefik
