name: ai-starter-kit-gpu
x-n8n:
  image: n8nio/n8n:latest
  networks: &id001
  - ai-starter-kit
  environment: &id002
  - DB_TYPE=postgresdb
  - DB_POSTGRESDB_HOST=postgres
  - DB_POSTGRESDB_USER=root
  - DB_POSTGRESDB_PASSWORD=password
  - N8N_DIAGNOSTICS_ENABLED=false
  - N8N_PERSONALIZATION_ENABLED=false
  - N8N_ENCRYPTION_KEY=super-secret-key
  - N8N_USER_MANAGEMENT_JWT_SECRET=even-more-secret
  - OLLAMA_HOST=ollama:11434
  - N8N_SECURE_COOKIE=false
  - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
  - N8N_RUNNERS_ENABLED=true
services:
  n8n:
    image: n8nio/n8n:latest
    networks: *id001
    environment: *id002
    hostname: n8n
    container_name: ai-starter-kit-n8n
    restart: unless-stopped
    ports:
    - 5678:5678
    volumes:
    - /DATA/AppData/ai-starter-kit/n8n_storage:/home/node/.n8n
    - /DATA/AppData/ai-starter-kit/n8n/backup:/backup
    - /DATA/AppData/ai-starter-kit/shared:/data/shared
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          memory: 128M
  n8n-import:
    image: n8nio/n8n:latest
    networks: *id001
    environment: *id002
    hostname: n8n-import
    container_name: ai-starter-kit-n8n-import
    entrypoint: /bin/sh
    command:
    - -c
    - rm -rf self-hosted-ai-starter-kit && git clone https://github.com/n8n-io/self-hosted-ai-starter-kit.git
      && cp -r self-hosted-ai-starter-kit/n8n/backup/* backup && n8n import:credentials
      --separate --input=/home/node/backup/credentials && n8n import:workflow --separate
      --input=/home/node/backup/workflows
    volumes:
    - /DATA/AppData/ai-starter-kit/n8n/backup:/home/node/backup
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    hostname: ai-starter-kit-postgres
    networks:
    - ai-starter-kit
    restart: unless-stopped
    environment:
    - POSTGRES_USER=root
    - POSTGRES_PASSWORD=password
    - POSTGRES_DB=n8n
    volumes:
    - /DATA/AppData/ai-starter-kit/postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h localhost -U root -d n8n
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: ai-starter-kit-postgres
  qdrant:
    image: qdrant/qdrant:latest
    hostname: qdrant
    container_name: ai-starter-kit-qdrant
    networks:
    - ai-starter-kit
    restart: unless-stopped
    ports:
    - 6333:6333
    volumes:
    - /DATA/AppData/ai-starter-kit/qdrant_storage:/qdrant/storage
  ollama:
    image: ollama/ollama:latest
    container_name: ai-starter-kit-ollama
    networks:
    - ai-starter-kit
    restart: unless-stopped
    ports:
    - 11434:11434
    volumes:
    - /DATA/AppData/ai-starter-kit/ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
  ollama-pull-llama:
    image: ollama/ollama:latest
    container_name: ai-starter-kit-ollama-pull-llama
    networks:
    - ai-starter-kit
    volumes:
    - /DATA/AppData/ai-starter-kit/ollama_storage:/root/.ollama
    entrypoint: /bin/sh
    environment:
    - OLLAMA_HOST=ollama:11434
    command:
    - -c
    - sleep 3; ollama pull llama3.2
    depends_on:
    - ollama
networks:
  ai-starter-kit:
    name: ai-starter-kit
    driver: bridge
