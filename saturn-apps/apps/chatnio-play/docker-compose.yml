name: chatnio
services:
  mysql:
    image: mysql:latest
    container_name: chatnio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chatnio
      MYSQL_USER: chatnio
      MYSQL_PASSWORD: chatnio123456!
      TZ: Asia/Shanghai
    expose:
    - '3306'
    volumes:
    - /DATA/AppData/chatnio/db:/var/lib/mysql
    networks:
    - chatnio-network
  redis:
    image: redis:latest
    container_name: chatnio-redis
    restart: unless-stopped
    expose:
    - '6379'
    volumes:
    - /DATA/AppData/chatnio/redis:/data
    networks:
    - chatnio-network
  chatnio:
    image: programzmh/chatnio:latest
    container_name: chatnio
    restart: unless-stopped
    ports:
    - 8000:8094
    depends_on:
    - mysql
    - redis
    links:
    - mysql
    - redis
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: chatnio
      MYSQL_PASSWORD: chatnio123456!
      MYSQL_DB: chatnio
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ''
      REDIS_DB: 0
      SERVE_STATIC: 'true'
    volumes:
    - /DATA/AppData/chatnio/config:/config
    - /DATA/AppData/chatnio/logs:/logs
    - /DATA/AppData/chatnio/storage:/storage
    networks:
    - chatnio-network
networks:
  chatnio-network:
    name: chatnio
    driver: bridge
