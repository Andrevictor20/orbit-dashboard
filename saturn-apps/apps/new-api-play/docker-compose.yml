name: new-api
services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: unless-stopped
    network_mode: bridge
    ports:
    - 3000:3000
    volumes:
    - /DATA/AppData/new-api/data:/data
    environment:
    - TZ=Asia/Shanghai
    deploy:
      resources:
        reservations:
          memory: 256M
