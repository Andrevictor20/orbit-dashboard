name: big-bear-ghost
services:
  app:
    container_name: big-bear-ghost
    image: ghost:6.57.1-alpine@sha256:6e37900accfb12e16fbc15bf94500e09829cb17e6448b3051e9c76446b4fbf53
    restart: on-failure
    networks:
    - ghost-network
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: saturn
      database__connection__database: ghost
      url: http://localhost:2368
    volumes:
    - /DATA/AppData/$AppID/content:/var/lib/ghost/content
    ports:
    - 2368:2368
    depends_on:
    - db
  db:
    container_name: big-bear-ghost-db
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: on-failure
    volumes:
    - /DATA/AppData/$AppID/mysql:/var/lib/mysql
    environment:
      MYSQL_USER: ghost
      MYSQL_DATABASE: ghost
      MYSQL_PASSWORD: saturn
      MYSQL_ROOT_PASSWORD: saturn
    networks:
    - ghost-network
networks:
  ghost-network:
    driver: bridge
