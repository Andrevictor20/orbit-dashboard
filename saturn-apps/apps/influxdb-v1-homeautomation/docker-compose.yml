name: influxdb-v1
services:
  influxdb-v1:
    container_name: influxdb-v1
    image: influxdb:1.8
    labels:
      icon: https://raw.githubusercontent.com/mr-manuel/saturn-HomeAutomation-AppStore/latest/Apps/InfluxDB-v1/icon.png
    network_mode: bridge
    ports:
    - target: 8086
      published: '8091'
      protocol: tcp
    restart: unless-stopped
    healthcheck:
      test: curl --fail -s http://localhost:8086/health || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/config
      target: /etc/influxdb
    - type: bind
      source: /DATA/AppData/$AppID/data
      target: /var/lib/influxdb
