name: calibre-web-arm
services:
  calibre-web-arm:
    environment:
      DOCKER_MODS: ghcr.io/linuxserver/mods:universal-calibre
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    image: linuxserver/calibre-web:arm32v7-0.6.20
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 8083
      published: '8083'
      protocol: tcp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/calibre-web-arm/config
      target: /config
    - type: bind
      source: /DATA/Media/Books
      target: /books
    container_name: calibre-web-arm
