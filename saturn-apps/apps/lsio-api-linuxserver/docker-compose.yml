name: linuxserver-lsio-api
services:
  app:
    image: linuxserver/lsio-api:version-9eda67ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/lsio-api/config
      target: /config
