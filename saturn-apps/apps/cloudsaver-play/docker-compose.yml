name: cloudsaver
services:
  cloudsaver:
    image: jiangrui1994/cloudsaver:latest
    container_name: cloudsaver
    ports:
    - 8008:8008
    volumes:
    - /DATA/AppData/cloudsaver/data:/app/data
    - /DATA/AppData/cloudsaver/config:/app/config
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 256M
