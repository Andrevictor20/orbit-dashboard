name: adguard-home
services:
  adguard-home:
    image: adguard/adguardhome:v0.107.79
    deploy:
      resources:
        reservations:
          memory: 64M
    network_mode: bridge
    ports:
    - target: 53
      published: '53'
      protocol: tcp
    - target: 53
      published: '53'
      protocol: udp
    - target: 3000
      published: '3001'
      protocol: tcp
    - target: 853
      published: '853'
      protocol: tcp
    - target: 784
      published: '784'
      protocol: udp
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/opt/adguardhome/work
      target: /opt/adguardhome/work
    - type: bind
      source: /DATA/AppData/$AppID/opt/adguardhome/conf
      target: /opt/adguardhome/conf
    container_name: adguard-home
