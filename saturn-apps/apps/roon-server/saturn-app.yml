id: roon-server
name: Roon Server
tagline: Music software that transforms your listening experience
description: 'Roon music software transforms your listening experience with rich metadata,
  discovery features, and audiophile sound. It works with streaming services and local
  files.


  Roon brings all your music together and adds bios, reviews, photos, lyrics, tour
  dates, and cross-linked credits for performers, songwriters, producers, engineers,
  and composers. Everything about music - browsing, discovery, collecting, and listening
  - is more engaging with Roon.


  RoonServer is the central server component. It runs on a Linux amd64/x86_64 host,
  stores the Roon database and settings, and serves your library to Roon Remote clients
  and audio endpoints on your local network. It is controlled from the Roon app and
  does not provide a browser-based WebUI.'
