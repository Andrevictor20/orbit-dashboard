name: playit-docker-web
services:
  playit:
    image: wisdomsky/playit-docker-web:1.0.10
    restart: unless-stopped
    network_mode: host
    ports:
    - target: 8008
      published: '8008'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/playit-docker-web/config
      target: /config
