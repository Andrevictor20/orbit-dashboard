name: coolstore-navidrome
services:
  navidrome:
    image: deluan/navidrome:sha-4f9418b
    ports:
    - 4533:4533
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ''
    volumes:
    - type: bind
      source: /DATA/AppData/coolstore-navidrome/data
      target: /data
    - type: bind
      source: /DATA/Media/Music
      target: /music
      read_only: true
