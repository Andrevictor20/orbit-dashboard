id: morphos-bigbear
name: Morphos
tagline: Self-hosted file converter server
description: Today we are forced to rely on third party services to convert files
  to other formats. This is a serious threat to our privacy, if we use such services
  to convert files with highly sensitive personal data. It can be used against us,
  sooner or later. Morphos server aims to solve the problem mentioned above, by providing
  a self-hosted server to convert files privately. The project provides an user-friendly
  web UI. For now, Morphos only supports images. Documents will be added soon.
category: Productivity
version: 1.0.0
developer: danvergara
store: bigbear
icon: icon.png
port: 8080
architectures:
- amd64
- arm64
