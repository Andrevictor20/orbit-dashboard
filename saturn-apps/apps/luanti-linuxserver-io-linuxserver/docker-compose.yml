name: linuxserver-luanti
services:
  app:
    image: linuxserver/luanti:5.17.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
    - target: 30000
      published: 30000
      protocol: udp
    volumes:
    - type: bind
      source: /DATA/AppData/luanti/config/.minetest
      target: /config/.minetest
