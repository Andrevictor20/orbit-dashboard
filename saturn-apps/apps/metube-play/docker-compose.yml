name: metube
services:
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    ports:
    - 8081:8081
    volumes:
    - /DATA/Downloads:/downloads
    network_mode: bridge
    deploy:
      resources:
        reservations:
          memory: 128M
