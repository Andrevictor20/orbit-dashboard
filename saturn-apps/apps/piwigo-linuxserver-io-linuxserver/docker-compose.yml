name: linuxserver-piwigo
services:
  app:
    image: linuxserver/piwigo:16.4.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
    - target: 80
      published: 80
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/piwigo/config
      target: /config
    - type: bind
      source: /DATA/AppData/piwigo/gallery
      target: /gallery
