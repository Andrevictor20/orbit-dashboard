version: '3'
name: firefly
services:
  firefly:
    image: uusec/firefly:latest
    container_name: firefly
    devices:
    - /dev/net/tun:/dev/net/tun
    network_mode: host
    volumes:
    - /lib/modules:/lib/modules
    - /DATA/AppData/firefly/conf:/firefly/conf
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    restart: unless-stopped
    environment:
    - FIREFLY_PASSWORD=firefly
    deploy:
      resources:
        reservations:
          memory: 32M
