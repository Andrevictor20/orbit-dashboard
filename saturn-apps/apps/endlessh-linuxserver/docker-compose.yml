name: linuxserver-endlessh
services:
  app:
    image: linuxserver/endlessh:version-dfe44eb2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MSDELAY: ''
      MAXLINES: ''
      MAXCLIENTS: ''
      LOGFILE: ''
      BINDFAMILY: ''
    ports:
    - target: 22
      published: 2222
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/endlessh/config
      target: /config
    - type: bind
      source: /DATA/AppData/endlessh/config
      target: /config
