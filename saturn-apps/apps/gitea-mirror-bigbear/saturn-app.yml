id: gitea-mirror-bigbear
name: Gitea Mirror
tagline: Mirror GitHub repositories to Gitea
description: Gitea Mirror is a modern web app for automatically mirroring repositories
  from GitHub to your self-hosted Gitea instance. It features a user-friendly interface
  to sync public, private, or starred GitHub repos, mirror entire organizations with
  structure preservation, and optionally mirror issues and labels. The application
  includes smart filtering, detailed logs, and scheduled automatic mirroring.
